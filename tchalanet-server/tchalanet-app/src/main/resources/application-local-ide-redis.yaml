# Profil pour dev avec Redis activé
# Usage: SPRING_PROFILES_ACTIVE=local-ide-redis

spring:

  # Enable Redis autoconfiguration for this profile
  autoconfigure:
    exclude: []

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:devredis}

# Enable Redis cache
tch:
  cache:
    redis:
      enabled: true

# Cache observability (dev only): see whether each read is served by the cache or the DB.
# - CombinedCache DEBUG            -> "cache-hit source=L1" / "source=L2" / "cache-miss source=DB" per read
# - spring.data.redis DEBUG        -> Redis cache layer + (de)serialization activity
# - Hibernate SQL DEBUG            -> a SQL statement appears only on a cache miss (DB was hit)
logging:
  level:
    com.tchalanet.server.app.config.cache: INFO
    org.springframework.data.redis: INFO
    org.hibernate.SQL: INFO


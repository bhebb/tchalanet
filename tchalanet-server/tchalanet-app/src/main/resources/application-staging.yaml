app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://test.tchalanet.com,https://stg.tchalanet.com,https://api.stg.tchalanet.com,https://tchalanet-web-stg.pages.dev,https://*.tchalanet-web-stg.pages.dev,https://app.stg.tchalanet.com}
  apiBaseUrl: ${APP_API_BASEURL:https://api.stg.tchalanet.com}

management:
  tracing:
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLER_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://otel-collector:4318/v1/traces}
          compression: gzip

spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

tch:
  us-lottery:
    enabled: ${TCH_US_LOTTERY_ENABLED:false}

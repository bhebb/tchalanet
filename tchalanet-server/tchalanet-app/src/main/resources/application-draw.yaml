tch:
  draw:
    cache:
      ttl:
        last7m: ${DRAW_CACHE_TTL_LAST7M:5}
        todaym: ${DRAW_CACHE_TTL_TODAYM:5}
        nexts: ${DRAW_CACHE_TTL_NEXTS:60}

    scheduler:
      active: true
      timezone: America/Port-au-Prince
      generate:
        active: true
        cron: "0 5 0 * * *"
        days-ahead: 7
        max-tenants-per-run: 1000
      open:
        active: true
        cron: "0 15 0 * * *"
        lookahead-hours: 24
        lag-hours: 1
        max-items-per-run: 10000
      processing:
        active: true
        cron: "0 */5 * * * *"
        close:
          active: true
          max-items-per-tick: 500
        fetch:
          active: true
          start-minutes-after-draw: 5
          retry-every-minutes: 10
          stop-minutes-after-draw: 240
          max-slots-per-tick: 10
        result-reminder:
          active: true
          manual-start-minutes-after-draw: 5
          automatic-overdue-minutes-after-draw: 60
          provisional-stuck-minutes-after-draw: 30
          max-slots-per-tick: 25
        apply:
          active: true
          start-minutes-after-draw: 10
          retry-every-minutes: 5
          stop-minutes-after-draw: 720
          max-items-per-tick: 500
        settle:
          active: true
          start-minutes-after-draw: 10
          retry-every-minutes: 5
          stop-minutes-after-draw: 1440
          max-items-per-tick: 1000
    results:
      limits:
        max_slots_per_tick: 100
        hard_days_back: 7
      defaults:
        manual_days_back: 0
        manual_max_slots: 50
      notifications:
        slack:
          enabled: ${TCH_DRAW_RESULTS_NOTIFICATIONS_SLACK_ENABLED:true}
          channel: ${TCH_DRAW_RESULTS_NOTIFICATIONS_SLACK_CHANNEL:general}
          priority: ${TCH_DRAW_RESULTS_NOTIFICATIONS_SLACK_PRIORITY:high}

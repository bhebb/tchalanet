name: Full Validation

on:
  workflow_dispatch:
    inputs:
      server_e2e_marker:
        description: 'Pytest marker expression for server E2E'
        required: false
        default: 'full_flow'
        type: string
      run_server_e2e:
        description: 'Run server E2E against the validation environment'
        required: false
        default: true
        type: boolean
      e2e_auth_provider:
        description: 'Auth provider used by server E2E'
        required: false
        default: firebase-emulator
        type: choice
        options:
          - firebase-emulator
          - firebase
      ensure_staging_infra:
        description: 'Create/deploy staging core infra before E2E when needed'
        required: false
        default: true
        type: boolean
      deploy_runtime_for_e2e:
        description: 'Build and deploy API + edge-service images before E2E'
        required: false
        default: true
        type: boolean
      run_perf:
        description: 'Run optional Locust smoke after E2E'
        required: false
        default: false
        type: boolean
      perf_users:
        description: 'Locust users'
        required: false
        default: '5'
        type: string
      perf_spawn_rate:
        description: 'Locust spawn rate'
        required: false
        default: '1'
        type: string
      perf_duration:
        description: 'Locust duration'
        required: false
        default: '2m'
        type: string
      run_mobile_build:
        description: 'Build a debug Android APK'
        required: false
        default: false
        type: boolean
  schedule:
    # Saturday 02:00 America/Toronto during daylight saving time: dependency analysis.
    - cron: '0 6 * * 6'
    # Sunday 02:00 America/Toronto during daylight saving time: E2E/full validation.
    - cron: '0 6 * * 0'

concurrency:
  group: full-validation-${{ github.ref }}
  # Every run owns the same disposable e2e-app server. A newer validation
  # supersedes an older one instead of queuing behind stale browser tests.
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Provision a fresh, disposable staging environment.
  # Runs on Sunday schedule and when E2E / runtime deploy is requested.
  # Destroys any existing stg-app first so every run starts from a clean slate.
  # DB is ephemeral (local containers); SKIP_BACKUP=1 everywhere.
  # ---------------------------------------------------------------------------
  env-setup:
    name: Provision fresh staging env
    if: >
      github.event.schedule == '0 6 * * 0' ||
      inputs.run_server_e2e == true ||
      inputs.deploy_runtime_for_e2e == true
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      server_host: ${{ steps.resolve-host.outputs.server_host }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SSH_PRIVATE_KEY_VALUE: ${{ secrets.SSH_PRIVATE_KEY }}
      DOPPLER_TOKEN_VALUE: ${{ secrets.DOPPLER_TOKEN_STG }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup hcloud
        uses: hetznercloud/setup-hcloud@ac9e7d74fb41a3ca44a6a3da123bd5aa70731e3a # v2.0.0
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Validate infra secrets
        run: |
          set -euo pipefail
          [ -n "$HCLOUD_TOKEN" ] || { echo "Missing HCLOUD_TOKEN" >&2; exit 1; }
          [ -n "$SSH_PRIVATE_KEY_VALUE" ] || { echo "Missing SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN_VALUE" ] || { echo "Missing DOPPLER_TOKEN_STG" >&2; exit 1; }

      - name: Prepare SSH key
        uses: ./.github/actions/prepare-ssh-key
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          derive_public_key: 'true'

      - name: Destroy existing E2E server
        working-directory: tchalanet-infra
        env:
          SKIP_BACKUP: '1'
          HCLOUD_SERVER_NAME: e2e-app
        run: |
          set -euo pipefail
          if hcloud server describe e2e-app >/dev/null 2>&1; then
            echo "→ Destroying existing e2e-app for a clean run..."
            printf 'destroy staging\n' | make staging-destroy
          else
            echo "→ No existing e2e-app to destroy"
          fi

      - name: Create fresh E2E server
        working-directory: tchalanet-infra
        run: |
          set -euo pipefail
          # Reuse the existing tch-net network and tch-fw firewall from permanent staging.
          bash scripts/hcloud/03-create-server.sh \
            --name e2e-app \
            --network "${HCLOUD_NETWORK_NAME:-tch-net}"

      - name: Resolve E2E server host
        id: resolve-host
        run: |
          set -euo pipefail
          ip="$(hcloud server describe e2e-app -o json | jq -r '.public_net.ipv4.ip')"
          [ -n "$ip" ] && [ "$ip" != "null" ] || { echo "Unable to resolve e2e-app IP" >&2; exit 1; }
          echo "server_host=$ip" >> "$GITHUB_OUTPUT"
          ssh-keyscan -H "$ip" >> ~/.ssh/known_hosts
          echo "E2E server host: $ip"

      - name: Push infra files to server
        uses: ./.github/actions/push-infra-files
        with:
          server_host: ${{ steps.resolve-host.outputs.server_host }}
          deploy_env: staging
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          firebase_admin_json_base64: ${{ secrets.FIREBASE_ADMIN_JSON_BASE64 }}
          derive_public_key: 'true'

      - name: Deploy core infra services
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOPPLER_TOKEN: ${{ env.DOPPLER_TOKEN_VALUE }}
        with:
          host: ${{ steps.resolve-host.outputs.server_host }}
          username: tch
          key: ${{ env.SSH_PRIVATE_KEY_VALUE }}
          script_stop: true
          envs: DOPPLER_TOKEN
          script: |
            set -euo pipefail
            cd /opt/tchalanet-infra
            if ! command -v make >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y make
            fi
            chmod +x scripts/remote/*.sh scripts/utils/*.sh || true
            ./scripts/remote/01-bootstrap.sh staging
            DOCKER_BIN="docker"
            if ! docker ps >/dev/null 2>&1; then
              DOCKER_BIN="sudo docker"
            fi
            DOCKER_BIN="$DOCKER_BIN" ENV=staging DOPPLER_TOKEN="$DOPPLER_TOKEN" scripts/remote/deploy-core-services.sh

  server-it:
    name: Server IT
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 0'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven verify with ITs
        run: ./mvnw -B verify

  dependency-check:
    name: OWASP Dependency-Check
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 6'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: OWASP Dependency-Check
        continue-on-error: true
        run: ./mvnw -B dependency-check:aggregate -DnvdApiDelay=6000
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: tchalanet-server/target/dependency-check-report.*
          if-no-files-found: warn

  build-nightly-api:
    name: Build nightly API image
    if: github.event.schedule == '0 6 * * 0' || inputs.deploy_runtime_for_e2e == true
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan image tag
        id: plan
        run: |
          short_sha="$(printf '%s' "${{ github.sha }}" | cut -c1-8)"
          echo "image_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven package
        working-directory: tchalanet-server
        run: ./mvnw -B -DskipTests -DskipITs=true package

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./tchalanet-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/tchalanet-api:${{ steps.plan.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.image_tag }}

      # Advisory image scan. Findings go to the Security tab; does not fail the
      # nightly. Promote to a gate (exit-code: 1) once the baseline is triaged.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/tchalanet-api:${{ steps.plan.outputs.image_tag }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy API results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  build-nightly-edge:
    name: Build nightly edge-service image
    if: github.event.schedule == '0 6 * * 0' || inputs.deploy_runtime_for_e2e == true
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan image tag
        id: plan
        run: |
          short_sha="$(printf '%s' "${{ github.sha }}" | cut -c1-8)"
          echo "image_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.19.0 --activate

      - name: Install deps
        working-directory: tchalanet-edge-service
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: tchalanet-edge-service
        run: pnpm build

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./tchalanet-edge-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/tchalanet-edge:${{ steps.plan.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.image_tag }}

      # Advisory image scan (see build-nightly-api for the promotion note).
      - name: Trivy scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/tchalanet-edge:${{ steps.plan.outputs.image_tag }}
          format: sarif
          output: trivy-edge.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy edge results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-edge.sarif
          category: trivy-edge

  deploy-nightly-runtime:
    name: Deploy nightly runtime
    needs: [build-nightly-api, build-nightly-edge, env-setup]
    if: |
      always() &&
      (github.event.schedule == '0 6 * * 0' || inputs.deploy_runtime_for_e2e == true) &&
      needs.build-nightly-api.result == 'success' &&
      needs.build-nightly-edge.result == 'success' &&
      needs.env-setup.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      api_base_url: ${{ steps.runtime-coordinates.outputs.api_base_url }}
      server_host: ${{ steps.runtime-coordinates.outputs.server_host }}
      firebase_emulator_host: ${{ steps.runtime-coordinates.outputs.firebase_emulator_host }}
      firebase_auth_emulator_url: ${{ steps.runtime-coordinates.outputs.firebase_auth_emulator_url }}
    env:
      SERVER_HOST: ${{ needs.env-setup.outputs.server_host }}
      SSH_PRIVATE_KEY_VALUE: ${{ secrets.SSH_PRIVATE_KEY }}
      DOPPLER_TOKEN_VALUE: ${{ secrets.DOPPLER_TOKEN_STG }}
      API_IMAGE_TAG: ${{ needs.build-nightly-api.outputs.image_tag }}
      EDGE_IMAGE_TAG: ${{ needs.build-nightly-edge.outputs.image_tag }}
      AUTH_PROVIDER: ${{ github.event_name == 'schedule' && 'firebase-emulator' || inputs.e2e_auth_provider }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate runtime deploy inputs
        run: |
          set -euo pipefail
          [ -n "$SERVER_HOST" ] || { echo "Missing SERVER_HOST" >&2; exit 1; }
          [ -n "$SSH_PRIVATE_KEY_VALUE" ] || { echo "Missing SSH_PRIVATE_KEY" >&2; exit 1; }
          [ -n "$DOPPLER_TOKEN_VALUE" ] || { echo "Missing DOPPLER_TOKEN_STG" >&2; exit 1; }
          [ -n "$API_IMAGE_TAG" ] || { echo "Missing API image tag" >&2; exit 1; }
          [ -n "$EDGE_IMAGE_TAG" ] || { echo "Missing edge image tag" >&2; exit 1; }

      - name: Prepare SSH key for runtime script sync
        uses: ./.github/actions/prepare-ssh-key
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          known_host: ${{ env.SERVER_HOST }}

      - name: Sync runtime deploy script
        run: |
          set -euo pipefail
          scp -i ~/.ssh/tchalanet_stg \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            tchalanet-infra/scripts/remote/deploy-runtime-services.sh \
            tch@"$SERVER_HOST":/opt/tchalanet-infra/scripts/remote/deploy-runtime-services.sh

      - name: Deploy runtime in validation mode
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          API_IMAGE_TAG: ${{ env.API_IMAGE_TAG }}
          EDGE_IMAGE_TAG: ${{ env.EDGE_IMAGE_TAG }}
          DOPPLER_TOKEN: ${{ env.DOPPLER_TOKEN_VALUE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          RUNTIME_IDENTITY_PROVIDER: ${{ env.AUTH_PROVIDER }}
          ENABLE_FIREBASE_EMULATOR: ${{ (github.event_name == 'schedule' || inputs.e2e_auth_provider == 'firebase-emulator') && '1' || '0' }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: tch
          key: ${{ env.SSH_PRIVATE_KEY_VALUE }}
          envs: API_IMAGE_TAG,EDGE_IMAGE_TAG,DOPPLER_TOKEN,GHCR_USERNAME,GHCR_TOKEN,RUNTIME_IDENTITY_PROVIDER,ENABLE_FIREBASE_EMULATOR
          script: |
            set -euo pipefail
            cd /opt/tchalanet-infra
            chmod +x scripts/remote/deploy-runtime-services.sh
            DOCKER_BIN="docker"
            if ! docker ps >/dev/null 2>&1; then
              DOCKER_BIN="sudo docker"
            fi
            printf '%s\n' "$GHCR_TOKEN" | $DOCKER_BIN login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin
            DOCKER_BIN="$DOCKER_BIN" ENV=staging API_IMAGE_TAG="$API_IMAGE_TAG" EDGE_IMAGE_TAG="$EDGE_IMAGE_TAG" \
              DEPLOY_API=1 DEPLOY_EDGE=1 FORCE_RECREATE=1 \
              VALIDATION_LOCAL_TRAEFIK=1 \
              WEB_ORIGINS="https://tchalanet-web-stg.pages.dev https://test.tchalanet.com https://stg.tchalanet.com https://api.stg.tchalanet.com https://app.stg.tchalanet.com http://localhost:4301 http://localhost:4302 http://localhost:4303" \
              RUNTIME_IDENTITY_PROVIDER="$RUNTIME_IDENTITY_PROVIDER" ENABLE_FIREBASE_EMULATOR="$ENABLE_FIREBASE_EMULATOR" \
              scripts/remote/deploy-runtime-services.sh

      - name: Publish runtime coordinates
        id: runtime-coordinates
        env:
          API_TUNNEL_PORT: '18443'
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" || { echo "Unable to resolve Firebase emulator host" >&2; exit 1; }
          # The validation server is disposable and is not the host currently
          # published by api.stg.tchalanet.com. Downstream jobs tunnel Traefik
          # over SSH while preserving this hostname for routing and TLS.
          echo "api_base_url=https://api.stg.tchalanet.com:${API_TUNNEL_PORT}/api/v1" >> "$GITHUB_OUTPUT"
          echo "server_host=$SERVER_HOST" >> "$GITHUB_OUTPUT"
          echo "firebase_emulator_host=$SERVER_HOST:9099" >> "$GITHUB_OUTPUT"
          echo "firebase_auth_emulator_url=http://$SERVER_HOST:9099" >> "$GITHUB_OUTPUT"

  server-e2e:
    name: Server E2E
    needs: [env-setup, deploy-nightly-runtime]
    if: |
      always() &&
      (github.event.schedule == '0 6 * * 0' || inputs.run_server_e2e == true) &&
      needs.env-setup.result == 'success' &&
      needs.deploy-nightly-runtime.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server/testing/e2e
    env:
      NIGHTLY_SERVER_HOST: ${{ needs.env-setup.outputs.server_host }}
      TCH_BASE_URL: ${{ needs.deploy-nightly-runtime.outputs.api_base_url || secrets.TCH_E2E_BASE_URL || vars.TCH_E2E_BASE_URL || 'https://api.stg.tchalanet.com/api/v1' }}
      # The disposable runtime is reached through the SSH tunnel below. Its
      # Traefik certificate is valid for the preserved hostname, but the GitHub
      # runner does not necessarily have the issuing CA installed.
      TCH_E2E_VERIFY_SSL: 'false'
      TCH_E2E_HTTP_TIMEOUT: ${{ vars.TCH_E2E_HTTP_TIMEOUT || '120' }}
      TCH_E2E_AUTH_PROVIDER: ${{ github.event_name == 'schedule' && 'firebase-emulator' || inputs.e2e_auth_provider || vars.TCH_E2E_AUTH_PROVIDER || 'firebase-emulator' }}
      TCH_FIREBASE_EMULATOR_HOST: ${{ secrets.TCH_FIREBASE_EMULATOR_HOST || vars.TCH_FIREBASE_EMULATOR_HOST }}
      TCH_FIREBASE_PROJECT_ID: ${{ secrets.TCH_FIREBASE_PROJECT_ID || vars.TCH_FIREBASE_PROJECT_ID || 'demo-tchalanet-local' }}
      TCH_FIREBASE_WEB_API_KEY: ${{ secrets.TCH_FIREBASE_WEB_API_KEY || vars.TCH_FIREBASE_WEB_API_KEY }}
      TCH_LOCAL_JWT_ISSUER: ${{ secrets.TCH_LOCAL_JWT_ISSUER }}
      TCH_LOCAL_JWT_SECRET: ${{ secrets.TCH_LOCAL_JWT_SECRET }}
      TCH_KEYCLOAK_TOKEN_URL: ${{ secrets.TCH_KEYCLOAK_TOKEN_URL }}
      TCH_KEYCLOAK_CLIENT_ID: ${{ secrets.TCH_KEYCLOAK_CLIENT_ID }}
      TCH_KEYCLOAK_CLIENT_SECRET: ${{ secrets.TCH_KEYCLOAK_CLIENT_SECRET }}
      TCH_SUPER_ADMIN_USERNAME: ${{ secrets.TCH_SUPER_ADMIN_USERNAME }}
      TCH_SUPER_ADMIN_PASSWORD: ${{ secrets.TCH_SUPER_ADMIN_PASSWORD }}
      TCH_TENANT_ADMIN_USERNAME: ${{ secrets.TCH_TENANT_ADMIN_USERNAME }}
      TCH_TENANT_ADMIN_PASSWORD: ${{ secrets.TCH_TENANT_ADMIN_PASSWORD }}
      TCH_SELLER_USERNAME: ${{ secrets.TCH_SELLER_USERNAME }}
      TCH_SELLER_PASSWORD: ${{ secrets.TCH_SELLER_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare SSH key for Firebase emulator tunnel
        if: ${{ env.TCH_E2E_AUTH_PROVIDER == 'firebase-emulator' }}
        uses: ./.github/actions/prepare-ssh-key
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          known_host: ${{ env.NIGHTLY_SERVER_HOST }}

      - name: Tunnel deployed API through SSH
        run: |
          set -euo pipefail
          sudo sed -i '/api\.stg\.tchalanet\.com/d' /etc/hosts
          echo '127.0.0.1 api.stg.tchalanet.com' | sudo tee -a /etc/hosts >/dev/null
          ssh -i ~/.ssh/tchalanet_stg \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -N -L 18443:127.0.0.1:443 \
            tch@"$NIGHTLY_SERVER_HOST" \
            >"$RUNNER_TEMP/api-tunnel.log" 2>&1 &
          tunnel_pid=$!
          echo "API_TUNNEL_PID=$tunnel_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              "https://api.stg.tchalanet.com:18443/api/v1/actuator/health" >/dev/null; then
              echo "Deployed API tunnel ready"
              break
            fi
            if [ "$attempt" = 20 ]; then
              cat "$RUNNER_TEMP/api-tunnel.log" >&2 || true
              exit 1
            fi
            sleep 2
          done

      - name: Tunnel Firebase Auth emulator
        if: ${{ env.TCH_E2E_AUTH_PROVIDER == 'firebase-emulator' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tchalanet_stg \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -N -L 9099:127.0.0.1:9099 \
            tch@"$NIGHTLY_SERVER_HOST" \
            >"$RUNNER_TEMP/firebase-emulator-tunnel.log" 2>&1 &
          tunnel_pid=$!
          echo "FIREBASE_TUNNEL_PID=$tunnel_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:9099/ >/dev/null; then
              echo "Firebase Auth emulator tunnel ready"
              echo "TCH_FIREBASE_EMULATOR_HOST=127.0.0.1:9099" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" = 20 ]; then
              cat "$RUNNER_TEMP/firebase-emulator-tunnel.log" >&2 || true
              exit 1
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tchalanet-server/testing/e2e/pyproject.toml

      - name: Validate E2E configuration
        run: |
          if [ "$TCH_E2E_AUTH_PROVIDER" = "firebase-emulator" ] && [ -z "$TCH_FIREBASE_EMULATOR_HOST" ] && [ -n "$NIGHTLY_SERVER_HOST" ]; then
            TCH_FIREBASE_EMULATOR_HOST="$NIGHTLY_SERVER_HOST:9099"
            echo "TCH_FIREBASE_EMULATOR_HOST=$TCH_FIREBASE_EMULATOR_HOST" >> "$GITHUB_ENV"
          fi
          test -n "$TCH_BASE_URL" || { echo "TCH_E2E_BASE_URL secret is required"; exit 1; }
          if [ "$TCH_E2E_AUTH_PROVIDER" = "firebase" ]; then
            test -n "$TCH_SUPER_ADMIN_USERNAME" || { echo "TCH_SUPER_ADMIN_USERNAME secret is required"; exit 1; }
            test -n "$TCH_SUPER_ADMIN_PASSWORD" || { echo "TCH_SUPER_ADMIN_PASSWORD secret is required"; exit 1; }
            test -n "$TCH_TENANT_ADMIN_USERNAME" || { echo "TCH_TENANT_ADMIN_USERNAME secret is required"; exit 1; }
            test -n "$TCH_TENANT_ADMIN_PASSWORD" || { echo "TCH_TENANT_ADMIN_PASSWORD secret is required"; exit 1; }
            test -n "$TCH_SELLER_USERNAME" || { echo "TCH_SELLER_USERNAME secret is required"; exit 1; }
            test -n "$TCH_SELLER_PASSWORD" || { echo "TCH_SELLER_PASSWORD secret is required"; exit 1; }
            test -n "$TCH_FIREBASE_PROJECT_ID" || { echo "TCH_FIREBASE_PROJECT_ID secret is required for firebase E2E"; exit 1; }
            test -n "$TCH_FIREBASE_WEB_API_KEY" || { echo "TCH_FIREBASE_WEB_API_KEY secret or variable is required for firebase E2E"; exit 1; }
          fi
          if [ "$TCH_E2E_AUTH_PROVIDER" = "firebase-emulator" ]; then
            if [ -z "$TCH_FIREBASE_EMULATOR_HOST" ] && [ -n "$NIGHTLY_SERVER_HOST" ]; then
              TCH_FIREBASE_EMULATOR_HOST="$NIGHTLY_SERVER_HOST:9099"
            fi
            test -n "$TCH_FIREBASE_EMULATOR_HOST" || { echo "TCH_FIREBASE_EMULATOR_HOST secret is required for firebase-emulator E2E"; exit 1; }
            test -n "$TCH_FIREBASE_PROJECT_ID" || { echo "TCH_FIREBASE_PROJECT_ID secret is required for firebase-emulator E2E"; exit 1; }
          fi
          if [ "$TCH_E2E_AUTH_PROVIDER" = "keycloak" ]; then
            test -n "$TCH_KEYCLOAK_TOKEN_URL" || { echo "TCH_KEYCLOAK_TOKEN_URL secret is required for keycloak E2E"; exit 1; }
          fi
          if [ "$TCH_E2E_AUTH_PROVIDER" = "local-jwt" ] || [ "$TCH_E2E_AUTH_PROVIDER" = "local-perf" ]; then
            test -n "$TCH_LOCAL_JWT_SECRET" || { echo "TCH_LOCAL_JWT_SECRET secret is required for local E2E"; exit 1; }
          fi
          {
            printf 'TCH_BASE_URL=%s\n' "$TCH_BASE_URL"
            printf 'TCH_E2E_VERIFY_SSL=%s\n' "$TCH_E2E_VERIFY_SSL"
            printf 'TCH_E2E_HTTP_TIMEOUT=%s\n' "$TCH_E2E_HTTP_TIMEOUT"
            printf 'TCH_E2E_AUTH_PROVIDER=%s\n' "$TCH_E2E_AUTH_PROVIDER"
            printf 'TCH_FIREBASE_EMULATOR_HOST=%s\n' "$TCH_FIREBASE_EMULATOR_HOST"
            printf 'TCH_FIREBASE_PROJECT_ID=%s\n' "$TCH_FIREBASE_PROJECT_ID"
            printf 'TCH_FIREBASE_WEB_API_KEY=%s\n' "$TCH_FIREBASE_WEB_API_KEY"
            printf 'TCH_LOCAL_JWT_ISSUER=%s\n' "$TCH_LOCAL_JWT_ISSUER"
            printf 'TCH_LOCAL_JWT_SECRET=%s\n' "$TCH_LOCAL_JWT_SECRET"
            printf 'TCH_KEYCLOAK_TOKEN_URL=%s\n' "$TCH_KEYCLOAK_TOKEN_URL"
            printf 'TCH_KEYCLOAK_CLIENT_ID=%s\n' "$TCH_KEYCLOAK_CLIENT_ID"
            printf 'TCH_KEYCLOAK_CLIENT_SECRET=%s\n' "$TCH_KEYCLOAK_CLIENT_SECRET"
            printf 'TCH_SUPER_ADMIN_USERNAME=%s\n' "$TCH_SUPER_ADMIN_USERNAME"
            printf 'TCH_SUPER_ADMIN_PASSWORD=%s\n' "$TCH_SUPER_ADMIN_PASSWORD"
            printf 'TCH_TENANT_ADMIN_USERNAME=%s\n' "$TCH_TENANT_ADMIN_USERNAME"
            printf 'TCH_TENANT_ADMIN_PASSWORD=%s\n' "$TCH_TENANT_ADMIN_PASSWORD"
            printf 'TCH_SELLER_USERNAME=%s\n' "$TCH_SELLER_USERNAME"
            printf 'TCH_SELLER_PASSWORD=%s\n' "$TCH_SELLER_PASSWORD"
          } > .env.local

      - name: Install E2E deps
        run: python -m pip install -e .

      - name: Run server E2E
        run: |
          python -m pytest -m "${{ inputs.server_e2e_marker || 'full_flow' }}"

      - name: Stop Firebase Auth emulator tunnel
        if: always()
        run: |
          if [ -n "${API_TUNNEL_PID:-}" ]; then
            kill "$API_TUNNEL_PID" 2>/dev/null || true
          fi
          if [ -n "${FIREBASE_TUNNEL_PID:-}" ]; then
            kill "$FIREBASE_TUNNEL_PID" 2>/dev/null || true
          fi

  server-perf:
    name: Server Locust smoke
    needs: [server-e2e, env-setup]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && inputs.run_perf == true) &&
      needs.server-e2e.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server/testing/e2e
    env:
      NIGHTLY_SERVER_HOST: ${{ needs.env-setup.outputs.server_host }}
      TCH_BASE_URL: ${{ secrets.TCH_E2E_BASE_URL || vars.TCH_E2E_BASE_URL || 'https://api.stg.tchalanet.com/api/v1' }}
      TCH_E2E_VERIFY_SSL: ${{ vars.TCH_E2E_VERIFY_SSL || 'true' }}
      TCH_E2E_HTTP_TIMEOUT: ${{ vars.TCH_E2E_HTTP_TIMEOUT || '120' }}
      TCH_E2E_AUTH_PROVIDER: ${{ inputs.e2e_auth_provider || 'firebase-emulator' }}
      TCH_FIREBASE_EMULATOR_HOST: ${{ secrets.TCH_FIREBASE_EMULATOR_HOST || vars.TCH_FIREBASE_EMULATOR_HOST }}
      TCH_FIREBASE_PROJECT_ID: ${{ secrets.TCH_FIREBASE_PROJECT_ID || vars.TCH_FIREBASE_PROJECT_ID || 'demo-tchalanet-local' }}
      TCH_FIREBASE_WEB_API_KEY: ${{ secrets.TCH_FIREBASE_WEB_API_KEY || vars.TCH_FIREBASE_WEB_API_KEY }}
      TCH_SELLER_USERNAME: ${{ secrets.TCH_SELLER_USERNAME }}
      TCH_SELLER_PASSWORD: ${{ secrets.TCH_SELLER_PASSWORD }}
      TCH_LOAD_ALLOWED_HOSTS: api.stg.tchalanet.com
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tchalanet-server/testing/e2e/pyproject.toml

      - name: Install E2E perf deps
        run: python -m pip install -e '.[perf]'

      - name: Prepare perf env
        run: |
          set -euo pipefail
          if [ "$TCH_E2E_AUTH_PROVIDER" = "firebase-emulator" ] && [ -z "$TCH_FIREBASE_EMULATOR_HOST" ] && [ -n "$NIGHTLY_SERVER_HOST" ]; then
            TCH_FIREBASE_EMULATOR_HOST="$NIGHTLY_SERVER_HOST:9099"
          fi
          {
            printf 'TCH_BASE_URL=%s\n' "$TCH_BASE_URL"
            printf 'TCH_E2E_VERIFY_SSL=%s\n' "$TCH_E2E_VERIFY_SSL"
            printf 'TCH_E2E_HTTP_TIMEOUT=%s\n' "$TCH_E2E_HTTP_TIMEOUT"
            printf 'TCH_E2E_AUTH_PROVIDER=%s\n' "$TCH_E2E_AUTH_PROVIDER"
            printf 'TCH_FIREBASE_EMULATOR_HOST=%s\n' "$TCH_FIREBASE_EMULATOR_HOST"
            printf 'TCH_FIREBASE_PROJECT_ID=%s\n' "$TCH_FIREBASE_PROJECT_ID"
            printf 'TCH_FIREBASE_WEB_API_KEY=%s\n' "$TCH_FIREBASE_WEB_API_KEY"
            printf 'TCH_SELLER_USERNAME=%s\n' "$TCH_SELLER_USERNAME"
            printf 'TCH_SELLER_PASSWORD=%s\n' "$TCH_SELLER_PASSWORD"
            printf 'TCH_LOAD_ALLOWED_HOSTS=%s\n' "$TCH_LOAD_ALLOWED_HOSTS"
          } > .env.local

      - name: Run Locust smoke
        run: |
          mkdir -p results
          locust -f loadtest/locustfile.py --headless \
            -u "${{ inputs.perf_users }}" \
            -r "${{ inputs.perf_spawn_rate }}" \
            -t "${{ inputs.perf_duration }}" \
            --host "$TCH_BASE_URL" \
            --csv results/nightly \
            --html results/nightly.html \
            --basket-min 5 \
            --basket-max 10

      - name: Upload Locust artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locust-nightly-results
          path: tchalanet-server/testing/e2e/results/

  web-e2e:
    name: Web E2E
    needs: [deploy-nightly-runtime]
    if: >
      always() &&
      (github.event_name != 'schedule' || github.event.schedule == '0 6 * * 0') &&
      (needs.deploy-nightly-runtime.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_runtime_for_e2e != true))
    runs-on: ubuntu-latest
    # Temporarily non-blocking while web-e2e hardens. Promote to a required gate
    # once the emulator/stub variant is consistently green.
    # When the disposable runtime deploy succeeds, the browser suite runs against
    # that API and the remote Firebase emulator. The self-contained stub variant
    # remains available only when a runtime deploy was not requested.
    continue-on-error: true
    env:
      WEB_E2E_API: ${{ needs.deploy-nightly-runtime.result == 'success' && '1' || '0' }}
      WEB_E2E_EMULATOR: ${{ needs.deploy-nightly-runtime.result == 'success' && '0' || '1' }}
      WEB_E2E_API_BASE_URL: ${{ needs.deploy-nightly-runtime.outputs.api_base_url }}
      WEB_E2E_FIREBASE_AUTH_EMULATOR_URL: ${{ needs.deploy-nightly-runtime.outputs.firebase_auth_emulator_url }}
      TCH_FIREBASE_EMULATOR_HOST: ${{ needs.deploy-nightly-runtime.outputs.firebase_emulator_host || '127.0.0.1:9099' }}
      NIGHTLY_SERVER_HOST: ${{ needs.deploy-nightly-runtime.outputs.server_host }}
      TCH_FIREBASE_PROJECT_ID: demo-tchalanet-local
      # Stub mode creates @e2e.local users locally. API mode uses the disposable
      # backend bootstrap identities linked to app_user_external_identity.
      TCH_E2E_SUPERADMIN_EMAIL: ${{ needs.deploy-nightly-runtime.result == 'success' && 'super_admin@localtest.me' || 'super_admin@e2e.local' }}
      TCH_E2E_SUPERADMIN_PASSWORD: ${{ needs.deploy-nightly-runtime.result == 'success' && 'Changeme1!' || 'e2e-password-123' }}
      TCH_E2E_ADMIN_EMAIL: ${{ needs.deploy-nightly-runtime.result == 'success' && 'admin@localtest.me' || 'admin@e2e.local' }}
      TCH_E2E_ADMIN_PASSWORD: ${{ needs.deploy-nightly-runtime.result == 'success' && 'Changeme1!' || 'e2e-password-123' }}
      TCH_E2E_TENANT_ID: stub-tenant-1
      TCH_E2E_SELLER_TERMINAL_ID: stub-terminal-1
    defaults:
      run:
        working-directory: tchalanet-web

    steps:
      - uses: actions/checkout@v7

      - name: Prepare SSH key for Firebase emulator tunnel
        if: ${{ env.WEB_E2E_API == '1' }}
        uses: ./.github/actions/prepare-ssh-key
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          known_host: ${{ env.NIGHTLY_SERVER_HOST }}

      - name: Tunnel deployed API through SSH
        if: ${{ env.WEB_E2E_API == '1' }}
        run: |
          set -euo pipefail
          sudo sed -i '/api\.stg\.tchalanet\.com/d' /etc/hosts
          echo '127.0.0.1 api.stg.tchalanet.com' | sudo tee -a /etc/hosts >/dev/null
          ssh -i ~/.ssh/tchalanet_stg \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -N -L 18443:127.0.0.1:443 \
            tch@"$NIGHTLY_SERVER_HOST" \
            >"$RUNNER_TEMP/api-tunnel.log" 2>&1 &
          tunnel_pid=$!
          echo "API_TUNNEL_PID=$tunnel_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              "https://api.stg.tchalanet.com:18443/api/v1/actuator/health" >/dev/null; then
              echo "Deployed API tunnel ready"
              break
            fi
            if [ "$attempt" = 20 ]; then
              cat "$RUNNER_TEMP/api-tunnel.log" >&2 || true
              exit 1
            fi
            sleep 2
          done

      - name: Tunnel Firebase Auth emulator
        if: ${{ env.WEB_E2E_API == '1' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tchalanet_stg \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -N -L 9099:127.0.0.1:9099 \
            tch@"$NIGHTLY_SERVER_HOST" \
            >"$RUNNER_TEMP/firebase-emulator-tunnel.log" 2>&1 &
          tunnel_pid=$!
          echo "FIREBASE_TUNNEL_PID=$tunnel_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:9099/ >/dev/null; then
              echo "Firebase Auth emulator tunnel ready"
              echo "TCH_FIREBASE_EMULATOR_HOST=127.0.0.1:9099" >> "$GITHUB_ENV"
              echo "WEB_E2E_FIREBASE_AUTH_EMULATOR_URL=http://127.0.0.1:9099" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" = 20 ]; then
              cat "$RUNNER_TEMP/firebase-emulator-tunnel.log" >&2 || true
              exit 1
            fi
            sleep 2
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tchalanet-web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare runtime config for disposable API
        if: ${{ env.WEB_E2E_API == '1' }}
        run: node apps/web-e2e/scripts/write-runtime-config.mjs

      - name: Start firebase auth emulator
        if: ${{ env.WEB_E2E_API != '1' }}
        working-directory: tchalanet-infra
        run: make up-firebase-emulator

      - name: Run web E2E
        run: pnpm nx e2e web-e2e

      - name: Stop firebase auth emulator
        if: ${{ always() && env.WEB_E2E_API != '1' }}
        working-directory: tchalanet-infra
        run: make down-firebase-emulator

      - name: Stop Firebase Auth emulator tunnel
        if: always()
        run: |
          if [ -n "${API_TUNNEL_PID:-}" ]; then
            kill "$API_TUNNEL_PID" 2>/dev/null || true
          fi
          if [ -n "${FIREBASE_TUNNEL_PID:-}" ]; then
            kill "$FIREBASE_TUNNEL_PID" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report
          path: |
            tchalanet-web/apps/web-e2e/playwright-report
            tchalanet-web/dist/.playwright/apps/web-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  mobile-full:
    name: Mobile full check
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 0'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-mobile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.run_mobile_build == true
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug

  # ---------------------------------------------------------------------------
  # Report: always runs after all test jobs. Writes a GitHub step summary and
  # posts to Slack when SLACK_WEBHOOK_URL is configured, or when the staging
  # Doppler config exposes the edge-service's SLACK_WEBHOOK_OPS_ALERTS value.
  # Exits 1 on failure so the overall workflow status reflects the E2E result.
  # ---------------------------------------------------------------------------
  report:
    name: Nightly E2E report
    if: always() && needs.env-setup.result != 'skipped'
    needs: [env-setup, server-it, server-e2e, web-e2e, mobile-full]
    runs-on: ubuntu-latest
    steps:
      - name: Build summary and notify
        env:
          ENV_SETUP: ${{ needs.env-setup.result }}
          SERVER_IT: ${{ needs.server-it.result }}
          SERVER_E2E: ${{ needs.server-e2e.result }}
          WEB_E2E: ${{ needs.web-e2e.result }}
          MOBILE: ${{ needs.mobile-full.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DOPPLER_TOKEN_VALUE: ${{ secrets.DOPPLER_TOKEN_STG }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          overall="success"
          for r in "$ENV_SETUP" "$SERVER_IT" "$SERVER_E2E"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || overall="failure"
          done
          icon=$( [ "$overall" = "success" ] && echo "✅" || echo "❌" )
          date_str="$(date -u '+%Y-%m-%d %H:%M UTC')"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## ${icon} Nightly E2E — ${date_str}

          | Job | Result |
          |-----|--------|
          | Staging env | ${ENV_SETUP} |
          | Server IT | ${SERVER_IT} |
          | Server E2E | ${SERVER_E2E} |
          | Web E2E (advisory) | ${WEB_E2E} |
          | Mobile | ${MOBILE} |

          [View run](${RUN_URL})
          SUMMARY

          slack_webhook_url="${SLACK_WEBHOOK_URL:-}"
          if [ -z "$slack_webhook_url" ] && [ -n "${DOPPLER_TOKEN_VALUE:-}" ]; then
            slack_webhook_url="$(
              docker run --rm \
                --entrypoint sh \
                -e DOPPLER_TOKEN="$DOPPLER_TOKEN_VALUE" \
                dopplerhq/cli:3.75.1 \
                -lc 'doppler secrets get SLACK_WEBHOOK_OPS_ALERTS --project tchalanet --config stg --plain'
            )" || {
              echo "Doppler Slack webhook lookup failed (non-blocking)"
              slack_webhook_url=""
            }
          fi
          if [ -n "$slack_webhook_url" ]; then
            echo "::add-mask::$slack_webhook_url"
            msg="${icon} *Nightly E2E* — ${date_str}\nEnv: ${ENV_SETUP} | Server E2E: ${SERVER_E2E} | Web E2E: ${WEB_E2E} | Mobile: ${MOBILE}\n${RUN_URL}"
            curl -sf -X POST "$slack_webhook_url" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"${msg}\"}" \
              || echo "Slack notification failed (non-blocking)"
          fi

          [ "$overall" = "success" ] || exit 1

  # ---------------------------------------------------------------------------
  # Teardown: always destroys the staging VM after tests and report complete.
  # SKIP_BACKUP=1 — the DB is ephemeral (local containers, disposable env).
  # Skipped when env-setup was skipped (Saturday dependency-check schedule).
  # ---------------------------------------------------------------------------
  env-teardown:
    name: Destroy staging env
    if: always() && needs.env-setup.result != 'skipped'
    needs: [env-setup, report]
    runs-on: ubuntu-latest
    environment: staging
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup hcloud
        uses: hetznercloud/setup-hcloud@ac9e7d74fb41a3ca44a6a3da123bd5aa70731e3a # v2.0.0
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Destroy E2E server
        working-directory: tchalanet-infra
        env:
          SKIP_BACKUP: '1'
          HCLOUD_SERVER_NAME: e2e-app
        run: |
          set -euo pipefail
          if hcloud server describe e2e-app >/dev/null 2>&1; then
            printf 'destroy staging\n' | make staging-destroy
          else
            echo "e2e-app already absent"
          fi

name: Mobile PR Check

on:
  # No path filter: runs on every PR so the required "Mobile gate" check is
  # always reported. The `changes` job gates the real work to mobile-slice PRs.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qE '^tchalanet-mobile/|^\.github/workflows/mobile-pr\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  mobile-check:
    name: Flutter analyze and test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-mobile

    steps:
      - uses: actions/checkout@v7

      # Avant Flutter : ne demande que python3, echoue en quelques secondes.
      - name: Check i18n corpus (fr/en/ht)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/i18n-audit.py --project mobile --strict

      - name: Cache Flutter pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('tchalanet-mobile/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Required check. Always runs; green unless mobile-check actually failed.
  gate:
    name: Mobile gate
    needs: [changes, mobile-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.mobile-check.result }}
        run: |
          echo "changes=$CHANGES mobile-check=$CHECK"
          if [ "$CHANGES" != "success" ]; then
            echo "change detection failed"; exit 1
          fi
          case "$CHECK" in
            success|skipped) echo "gate ok" ;;
            *) echo "mobile-check $CHECK"; exit 1 ;;
          esac

name: Web PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-web/**'
      - '.github/workflows/web-pr.yml'
  workflow_dispatch:

concurrency:
  group: web-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tchalanet-web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint web apps
        run: pnpm run lint

      - name: Test web apps
        run: pnpm run test

      - name: Build web apps
        run: pnpm nx run-many -t build -p public-portal,admin-portal,platform-portal

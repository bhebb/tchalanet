name: Web PR Check

on:
  # No path filter: runs on every PR so the required "Web gate" check is always
  # reported. The `changes` job gates the real work to web-slice PRs.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qE '^tchalanet-web/|^\.github/workflows/web-pr\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  web-check:
    name: Web lint, test, and build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tchalanet-web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint web apps
        env:
          NX_DAEMON: 'false'
        run: pnpm exec nx run-many -t lint -p public-portal,admin-portal,platform-portal --parallel=1

      - name: Check responsive breakpoint contract
        run: pnpm run breakpoints:contract

      - name: Test web apps
        run: pnpm run test

      - name: Check admin portal types
        run: pnpm exec tsc -p apps/admin-portal/tsconfig.app.json --noEmit

      - name: Build web apps
        run: pnpm nx run-many -t build -p public-portal,admin-portal,platform-portal

  # Required check. Always runs; green unless web-check actually failed.
  gate:
    name: Web gate
    needs: [changes, web-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.web-check.result }}
        run: |
          echo "changes=$CHANGES web-check=$CHECK"
          if [ "$CHANGES" != "success" ]; then
            echo "change detection failed"; exit 1
          fi
          case "$CHECK" in
            success|skipped) echo "gate ok" ;;
            *) echo "web-check $CHECK"; exit 1 ;;
          esac

name: Web PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-web/**'
      - '.github/workflows/web-pr.yml'
  workflow_dispatch:

concurrency:
  group: web-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-check:
    name: Web lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tchalanet-web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint web apps
        run: pnpm run lint

      - name: Test web apps
        run: pnpm run test

      - name: Check admin portal types
        run: pnpm exec tsc -p apps/admin-portal/tsconfig.app.json --noEmit

      - name: Build web apps
        run: pnpm nx run-many -t build -p public-portal,admin-portal,platform-portal

name: Database Backup

# Backup PostgreSQL chiffré vers Cloudflare R2, vérifié par restauration.
#
# Le backup tourne depuis GitHub Actions plutôt qu'un timer sur la VM pour que
# tout échec soit visible : un backup silencieusement mort est pire que pas de
# backup, parce qu'on croit être couvert.
#
# Secrets requis :
#   SERVER_HOST / PROD_SERVER_HOST      hôte cible
#   SSH_PRIVATE_KEY / SSH_PRIVATE_KEY_PROD
#   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   BACKUP_AGE_PUBLIC_KEY               clé publique age (chiffrement)
#   BACKUP_AGE_PRIVATE_KEY              clé privée age (répétition de restauration)

on:
  schedule:
    # Prod : quotidien. Staging : hebdomadaire le dimanche — les données y sont
    # jetables et recréables, un backup par jour n'y vaut pas son coût de
    # stockage tant que la prod n'existe pas.
    # Minute décalée : les crons à l'heure pile saturent les runners GitHub et
    # se font retarder ou sauter.
    - cron: '17 2 * * *'   # prod, quotidien
    - cron: '17 3 * * 0'   # staging, dimanche
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to back up'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      rehearse_restore:
        description: 'Run a restore rehearsal after the backup'
        required: false
        default: false
        type: boolean

concurrency:
  group: db-backup-${{ ((github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || inputs.target_environment == 'production') && 'prod' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup ${{ ((github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || inputs.target_environment == 'production') && 'prod' || 'staging' }}
    runs-on: ubuntu-latest
    env:
      # Le cron quotidien vise la prod, l'hebdomadaire le staging. Un
      # déclenchement manuel suit toujours l'entrée choisie.
      IS_PROD: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || inputs.target_environment == 'production' }}
    outputs:
      skipped: ${{ steps.guard.outputs.skipped }}
      deploy_env: ${{ steps.guard.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target and validate secrets
        id: guard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AGE_PUB: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          PROD_HOST: ${{ secrets.PROD_SERVER_HOST }}
          STG_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail

          if [ "$IS_PROD" = "true" ]; then
            DEPLOY_ENV=prod; HOST="$PROD_HOST"
          else
            DEPLOY_ENV=staging; HOST="$STG_HOST"
          fi

          # Un environnement non provisionné n'a pas d'hôte. On saute au lieu
          # d'échouer : un workflow rouge tous les jours pour une prod qui
          # n'existe pas encore apprend à ignorer les échecs, ce qui annule
          # l'intérêt d'alerter. Dès que le secret existe, le backup tourne et
          # échoue bruyamment s'il est cassé.
          if [ -z "$HOST" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Backup ignoré — $DEPLOY_ENV non provisionné"
              echo ""
              echo "Aucun hôte configuré pour \`$DEPLOY_ENV\`. Ajouter le secret"
              echo "\`$([ "$DEPLOY_ENV" = prod ] && echo PROD_SERVER_HOST || echo SERVER_HOST)\` active le backup."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Backup ignoré — $DEPLOY_ENV n'a pas d'hôte configuré"
            exit 0
          fi

          for v in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET AGE_PUB; do
            [ -n "${!v}" ] || { echo "Missing secret: $v" >&2; exit 1; }
          done

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "Target: $DEPLOY_ENV"

      - name: Run backup on the database host
        if: steps.guard.outputs.skipped == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.IS_PROD == 'true' && secrets.PROD_SERVER_HOST || secrets.SERVER_HOST }}
          username: tch
          key: ${{ env.IS_PROD == 'true' && secrets.SSH_PRIVATE_KEY_PROD || secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_ENV,CLOUDFLARE_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,BACKUP_AGE_PUBLIC_KEY
          script: |
            set -euo pipefail
            cd /opt/tchalanet-infra
            ENV="$DEPLOY_ENV" ./scripts/remote/pg-backup.sh
        env:
          DEPLOY_ENV: ${{ steps.guard.outputs.deploy_env }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}

  rehearse-restore:
    name: Restore rehearsal
    needs: backup
    # Hebdomadaire le dimanche, ou sur demande. La répétition tourne sur un
    # runner isolé et ne touche à aucun environnement : elle prouve seulement
    # que le dernier backup est réellement exploitable.
    if: |
      always() && needs.backup.result == 'success' &&
      needs.backup.outputs.skipped == 'false' &&
      (inputs.rehearse_restore == true || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install age and rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone

      - name: Rehearse restore from the latest backup
        env:
          ENV: ${{ needs.backup.outputs.deploy_env }}
          DRY_RUN: '1'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AGE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          chmod 600 "$RUNNER_TEMP/age.key"
          export BACKUP_AGE_PRIVATE_KEY_FILE="$RUNNER_TEMP/age.key"
          ./tchalanet-infra/scripts/remote/pg-restore.sh

      - name: Clean up the private key
        if: always()
        run: rm -f "$RUNNER_TEMP/age.key" || true

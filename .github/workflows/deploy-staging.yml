name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      build_api:
        description: 'Build et push image API'
        required: false
        default: 'false'
        type: boolean
      build_web:
        description: 'Build et push image Web'
        required: false
        default: 'false'
        type: boolean
      build_edge:
        description: 'Build et push image Edge'
        required: false
        default: 'false'
        type: boolean
      deploy_infra:
        description: 'Déployer les services infra sur staging'
        required: false
        default: 'true'
        type: boolean
      infra_action:
        description: 'Action infra staging'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
          - create
          - recreate
          - none
      infra_destroy_confirm:
        description: 'Required for destroy/recreate: type "destroy staging"'
        required: false
        default: ''
        type: string
      skip_destroy_backup:
        description: 'Skip pre-destroy VM backup (safe for Neon-backed staging)'
        required: false
        default: true
        type: boolean
      image_tag:
        description: 'Tag image (vide = sha-<short_sha>)'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  compute-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Compute IMAGE_TAG
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=sha-$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
          fi

  build-api:
    needs: compute-tag
    if: inputs.build_api == true && inputs.infra_action != 'destroy'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.compute-tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven package
        working-directory: tchalanet-server
        run: ./mvnw -B -DskipTests -DskipITs=true package

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./tchalanet-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/tchalanet-api:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

  build-edge:
    needs: compute-tag
    if: inputs.build_edge == true && inputs.infra_action != 'destroy'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.compute-tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.x'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.19.0 --activate

      - name: Install deps
        working-directory: tchalanet-edge-service
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: tchalanet-edge-service
        run: pnpm build

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Edge image
        uses: docker/build-push-action@v6
        with:
          context: ./tchalanet-edge-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/tchalanet-edge:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

  infra-destroy:
    if: inputs.infra_action == 'destroy' || inputs.infra_action == 'recreate'
    runs-on: ubuntu-latest
    environment: staging
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup hcloud
        uses: hetznercloud/setup-hcloud@v1
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Prepare SSH key for optional backup
        if: inputs.skip_destroy_backup == false
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/tchalanet_stg
          chmod 600 ~/.ssh/tchalanet_stg
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Destroy staging server
        working-directory: tchalanet-infra
        env:
          CONFIRM: ${{ inputs.infra_destroy_confirm }}
          SKIP_BACKUP: ${{ inputs.skip_destroy_backup && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "destroy staging" ]; then
            echo 'infra_destroy_confirm must be exactly: destroy staging' >&2
            exit 1
          fi
          printf 'destroy staging\n' | make staging-destroy

  infra-create:
    needs: infra-destroy
    if: |
      always() &&
      (inputs.infra_action == 'create' || inputs.infra_action == 'recreate') &&
      (needs.infra-destroy.result == 'success' || needs.infra-destroy.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    outputs:
      server_host: ${{ steps.server-ip.outputs.server_host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup hcloud
        uses: hetznercloud/setup-hcloud@v1
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Prepare SSH key for provisioning
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/tchalanet_stg
          chmod 600 ~/.ssh/tchalanet_stg
          ssh-keygen -y -f ~/.ssh/tchalanet_stg > ~/.ssh/tchalanet_stg.pub

      - name: Create staging server
        working-directory: tchalanet-infra
        run: make staging-create

      - name: Capture staging IP
        id: server-ip
        run: |
          set -euo pipefail
          IP="$(hcloud server describe stg-app -o json | jq -r '.public_net.ipv4.ip')"
          if [ -z "$IP" ] || [ "$IP" = "null" ]; then
            echo "Unable to resolve stg-app public IP" >&2
            exit 1
          fi
          echo "server_host=$IP" >> "$GITHUB_OUTPUT"
          echo "Staging server IP: $IP"

  deploy:
    needs: [compute-tag, build-api, build-edge, infra-destroy, infra-create]
    if: |
      always() &&
      inputs.deploy_infra == true &&
      (inputs.infra_action == 'deploy' || inputs.infra_action == 'create' || inputs.infra_action == 'recreate') &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_TAG: ${{ needs.compute-tag.outputs.image_tag }}
      SERVER_HOST: ${{ needs.infra-create.outputs.server_host || secrets.SERVER_HOST }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare SSH key for infra sync
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/tchalanet_stg
          chmod 600 ~/.ssh/tchalanet_stg

      - name: Add host to known_hosts
        run: ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Push infra files to server
        working-directory: tchalanet-infra
        run: |
          chmod +x scripts/remote/*.sh || true
          ./scripts/remote/push-infra-bkup.sh "$SERVER_HOST" staging

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: tch
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/tchalanet-infra

            if ! command -v make >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y make
            fi

            chmod +x scripts/remote/*.sh scripts/utils/*.sh || true
            ./scripts/remote/01-bootstrap.sh staging

            DOCKER_BIN="docker"
            if ! docker ps >/dev/null 2>&1; then
              DOCKER_BIN="sudo docker"
            fi

            $DOCKER_BIN network create edge-staging || true
            $DOCKER_BIN network create back-staging || true

            DOCKER_BIN="$DOCKER_BIN" make env-merge ENV=staging

            echo "${{ github.token }}" | $DOCKER_BIN login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            if [ -z "${{ secrets.DOPPLER_TOKEN_STG }}" ]; then
              echo "DOPPLER_TOKEN_STG manquant" >&2; exit 1
            fi
            $DOCKER_BIN run --rm \
              --entrypoint sh \
              -e DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN_STG }}" \
              -v "$PWD":/work -w /work \
              dopplerhq/cli:3.72 \
              -lc 'doppler secrets download --format env --project tchalanet --config stg > envs/staging/.secrets && chmod 600 envs/staging/.secrets'
            sudo chown "$(id -u):$(id -g)" envs/staging/.secrets
            chmod 600 envs/staging/.secrets

            if [ "${{ inputs.build_edge }}" = "true" ]; then
              DOCKER_BIN="$DOCKER_BIN" IMAGE_TAG="${{ env.IMAGE_TAG }}" TCH_EDGE_TAG="${{ env.IMAGE_TAG }}" make up-staging ENV=staging
            else
              DOCKER_BIN="$DOCKER_BIN" IMAGE_TAG="${{ env.IMAGE_TAG }}" make up-staging ENV=staging
            fi

            echo "Waiting for staging API health..."
            for attempt in $(seq 1 36); do
              if curl -kfsS --connect-timeout 5 --max-time 15 \
                https://api.stg.tchalanet.com/api/v1/actuator/health >/dev/null; then
                echo "Staging API health OK"
                break
              fi
              if [ "$attempt" = "36" ]; then
                $DOCKER_BIN ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
                $DOCKER_BIN logs --tail 160 tchl-api-staging || true
                exit 1
              fi
              sleep 5
            done

            echo "Staging deploy done — IMAGE_TAG=${{ env.IMAGE_TAG }}"

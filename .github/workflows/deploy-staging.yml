name: Manage Staging Infra

on:
  workflow_dispatch:
    inputs:
      infra_action:
        description: 'Action infra staging'
        required: true
        default: 'deploy-core'
        type: choice
        options:
          - deploy-core
          - destroy
          - create
          - recreate
          - none
      infra_destroy_confirm:
        description: 'Required for destroy/recreate: type "destroy staging"'
        required: false
        default: ''
        type: string
      skip_destroy_backup:
        description: 'Skip pre-destroy VM backup (staging data is disposable)'
        required: false
        default: true
        type: boolean

concurrency:
  group: staging-infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  infra-destroy:
    if: inputs.infra_action == 'destroy' || inputs.infra_action == 'recreate'
    runs-on: ubuntu-latest
    environment: staging
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup hcloud
        uses: hetznercloud/setup-hcloud@ac9e7d74fb41a3ca44a6a3da123bd5aa70731e3a # v2.0.0
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Prepare SSH key for optional backup
        if: inputs.skip_destroy_backup == false
        uses: ./.github/actions/prepare-ssh-key
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          known_host: ${{ secrets.SERVER_HOST }}

      - name: Destroy staging server
        working-directory: tchalanet-infra
        env:
          CONFIRM: ${{ inputs.infra_destroy_confirm }}
          SKIP_BACKUP: ${{ inputs.skip_destroy_backup && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "destroy staging" ]; then
            echo 'infra_destroy_confirm must be exactly: destroy staging' >&2
            exit 1
          fi
          printf 'destroy staging\n' | make staging-destroy

  infra-create:
    needs: infra-destroy
    if: |
      always() &&
      (inputs.infra_action == 'create' || inputs.infra_action == 'recreate') &&
      (needs.infra-destroy.result == 'success' || needs.infra-destroy.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    outputs:
      server_host: ${{ steps.server-ip.outputs.server_host }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup hcloud
        uses: hetznercloud/setup-hcloud@ac9e7d74fb41a3ca44a6a3da123bd5aa70731e3a # v2.0.0
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Prepare SSH key for provisioning
        uses: ./.github/actions/prepare-ssh-key
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_file: tchalanet_stg
          derive_public_key: 'true'

      - name: Create staging server
        working-directory: tchalanet-infra
        run: make staging-create

      - name: Capture staging IP
        id: server-ip
        run: |
          set -euo pipefail
          IP="$(hcloud server describe stg-app -o json | jq -r '.public_net.ipv4.ip')"
          if [ -z "$IP" ] || [ "$IP" = "null" ]; then
            echo "Unable to resolve stg-app public IP" >&2
            exit 1
          fi
          echo "server_host=$IP" >> "$GITHUB_OUTPUT"
          echo "Staging server IP: $IP"

  infra-core:
    needs: [infra-destroy, infra-create]
    if: |
      always() &&
      (inputs.infra_action == 'deploy-core' || inputs.infra_action == 'create' || inputs.infra_action == 'recreate') &&
      (needs.infra-destroy.result == 'success' || needs.infra-destroy.result == 'skipped') &&
      (needs.infra-create.result == 'success' || needs.infra-create.result == 'skipped')
    uses: ./.github/workflows/reusable-staging-core-infra.yml
    with:
      create_if_missing: false
      deploy_core: true
      server_host: ${{ needs.infra-create.outputs.server_host }}
    secrets:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOPPLER_TOKEN_STG: ${{ secrets.DOPPLER_TOKEN_STG }}
      FIREBASE_ADMIN_JSON_BASE64: ${{ secrets.FIREBASE_ADMIN_JSON_BASE64 }}

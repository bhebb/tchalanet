name: Deploy Lottery Proxy Worker

# Deploys the Cloudflare Worker that relays US-lottery result fetches for
# providers blocked when called directly from the Hetzner staging server
# (datacenter/ASN-level bot blocking). Manual trigger only.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN            - Workers Scripts:Edit (already used by docs.yml)
#   CLOUDFLARE_ACCOUNT_ID
#   LOTTERY_PROXY_SHARED_SECRET      - shared secret the Worker checks on X-Proxy-Secret

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-infra/cloudflare-worker-proxy

    steps:
      - uses: actions/checkout@v7

      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SECRET: ${{ secrets.LOTTERY_PROXY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [ -n "$PROXY_SECRET" ] || { echo "Missing LOTTERY_PROXY_SHARED_SECRET" >&2; exit 1; }

      - name: Set Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SECRET: ${{ secrets.LOTTERY_PROXY_SHARED_SECRET }}
        run: |
          printf '%s' "$PROXY_SECRET" | npx --yes wrangler@4 secret put PROXY_SHARED_SECRET

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy

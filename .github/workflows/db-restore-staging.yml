name: Restore staging database

on:
  workflow_dispatch:
    inputs:
      backup_object:
        description: "Exact encrypted backup object in the backup R2 bucket"
        required: true
        type: string
      confirmation:
        description: "Type exactly: restore staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-database-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Restore staging from R2
    if: inputs.confirmation == 'restore staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Install restore tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone

      - name: Configure SSH Docker context
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/staging.key"
          ssh-keyscan -H "$SERVER_HOST" > "$RUNNER_TEMP/staging.known_hosts"
          cat > "$RUNNER_TEMP/ssh-config" <<EOF
          Host tchalanet-staging
            HostName $SERVER_HOST
            User tch
            IdentityFile $RUNNER_TEMP/staging.key
            UserKnownHostsFile $RUNNER_TEMP/staging.known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$RUNNER_TEMP/ssh-config"
          mkdir -p "$HOME/.ssh"
          cp "$RUNNER_TEMP/ssh-config" "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          docker context create tchalanet-staging --docker "host=ssh://tchalanet-staging"
          DOCKER_CONTEXT=tchalanet-staging docker ps --format '{{.Names}}' \
            | grep -Fx 'tchl-postgres-staging'

      - name: Restore the explicitly selected staging backup
        env:
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AGE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$BACKUP_OBJECT" in
            staging/????/??/*.tar.gz.age) ;;
            *) echo "Refusing non-staging or non-encrypted backup object" >&2; exit 1 ;;
          esac
          for v in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET AGE_KEY; do
            test -n "${!v}" || { echo "$v is required" >&2; exit 1; }
          done
          printf '%s' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          chmod 600 "$RUNNER_TEMP/age.key"
          printf 'restore staging\n' | \
            DOCKER_CONTEXT=tchalanet-staging \
            ENV=staging \
            BACKUP_AGE_PRIVATE_KEY_FILE="$RUNNER_TEMP/age.key" \
            ./tchalanet-infra/scripts/remote/pg-restore.sh "$BACKUP_OBJECT"

      - name: Clean up restore credentials and Docker context
        if: always()
        run: |
          docker context rm -f tchalanet-staging || true
          rm -f "$RUNNER_TEMP/staging.key" "$RUNNER_TEMP/staging.known_hosts" \
            "$RUNNER_TEMP/ssh-config" "$RUNNER_TEMP/age.key"

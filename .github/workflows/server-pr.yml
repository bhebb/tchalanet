name: Server PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-server/**'
      - '.github/workflows/server-pr.yml'
  workflow_dispatch:

concurrency:
  group: server-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  server-verify:
    name: Server verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Spotless check
        continue-on-error: true
        run: ./mvnw -B spotless:check

      - name: Maven verify
        run: ./mvnw -B -DskipITs=true verify

      - name: Checkstyle
        continue-on-error: true
        run: ./mvnw -B checkstyle:check

      - name: PMD
        continue-on-error: true
        run: ./mvnw -B pmd:check

      - name: SpotBugs
        continue-on-error: true
        run: ./mvnw -B spotbugs:check

      - name: Jacoco coverage comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            tchalanet-server/tchalanet-common/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-catalog/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-platform/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-core/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-app/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 20
          min-coverage-changed-files: 50
          title: "## Coverage Report"
          update-comment: true

      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-jacoco-reports
          path: |
            tchalanet-server/**/target/site/jacoco/**
            tchalanet-server/**/target/jacoco.exec
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: OWASP Dependency-Check
        continue-on-error: true
        run: ./mvnw -B dependency-check:aggregate -DnvdApiDelay=6000
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Summarize Dependency-Check results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'tchalanet-server/target/dependency-check-report.json';
            if (!fs.existsSync(path)) {
              core.warning('No dependency-check report found');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const deps = report.dependencies || [];
            const vulns = deps.filter(d => d.vulnerabilities && d.vulnerabilities.length > 0);
            let critical = 0, high = 0, medium = 0, low = 0, total = 0;
            for (const dep of vulns) {
              for (const v of dep.vulnerabilities) {
                total++;
                const score = v.cvssv3 ? v.cvssv3.baseScore : (v.cvssv2 ? v.cvssv2.score : 0);
                if (score >= 9.0) critical++;
                else if (score >= 7.0) high++;
                else if (score >= 4.0) medium++;
                else low++;
              }
            }
            const icon = critical > 0 ? '🔴' : high > 0 ? '🟠' : total > 0 ? '🟡' : '🟢';
            let body = `## ${icon} OWASP Dependency-Check\n\n`;
            body += `| Severity | Count |\n|----------|-------|\n`;
            body += `| Critical | ${critical} |\n| High | ${high} |\n| Medium | ${medium} |\n| Low | ${low} |\n`;
            body += `| **Total** | **${total}** |\n\n`;
            if (vulns.length > 0) {
              body += `<details><summary>Vulnerable dependencies (${vulns.length})</summary>\n\n`;
              for (const dep of vulns.slice(0, 20)) {
                const name = dep.fileName || dep.filePath || 'unknown';
                const cves = dep.vulnerabilities.map(v => v.name).join(', ');
                body += `- **${name}**: ${cves}\n`;
              }
              if (vulns.length > 20) body += `\n_...and ${vulns.length - 20} more_\n`;
              body += `\n</details>\n`;
            }
            body += `\n_Full report available as build artifact._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes('OWASP Dependency-Check'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            }

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: tchalanet-server/target/dependency-check-report.*
          if-no-files-found: warn

name: Server PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-server/**'
      - '.github/workflows/server-pr.yml'
  workflow_dispatch:

concurrency:
  group: server-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  server-verify:
    name: Server verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Spotless check
        continue-on-error: true
        run: ./mvnw -B spotless:check

      - name: Maven verify
        run: ./mvnw -B -DskipITs=true verify

      - name: Checkstyle
        continue-on-error: true
        run: ./mvnw -B checkstyle:check

      - name: PMD
        continue-on-error: true
        run: ./mvnw -B pmd:check

      - name: SpotBugs
        continue-on-error: true
        run: ./mvnw -B spotbugs:check

      - name: Jacoco coverage comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            tchalanet-server/tchalanet-common/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-catalog/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-platform/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-core/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-app/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 20
          min-coverage-changed-files: 50
          title: "## Coverage Report"
          update-comment: true

      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-jacoco-reports
          path: |
            tchalanet-server/**/target/site/jacoco/**
            tchalanet-server/**/target/jacoco.exec
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: OWASP Dependency-Check
        continue-on-error: true
        run: ./mvnw -B dependency-check:aggregate -DnvdApiDelay=6000
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: tchalanet-server/target/dependency-check-report.*
          if-no-files-found: warn

name: Server PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-server/**'
      - '.github/workflows/server-pr.yml'
  workflow_dispatch:

concurrency:
  group: server-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-verify:
    name: Server verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Spotless check
        continue-on-error: true
        run: ./mvnw -B spotless:check

      - name: Maven verify
        run: ./mvnw -B -DskipITs=true verify

      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-jacoco-reports
          path: |
            tchalanet-server/**/target/site/jacoco/**
            tchalanet-server/**/target/jacoco.exec
          if-no-files-found: warn

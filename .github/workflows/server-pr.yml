name: Server PR Check

on:
  # No path filter: the workflow runs on every PR so the required "Server gate"
  # check is always reported. The `changes` job decides whether the real work
  # runs; when the server slice is untouched, heavy jobs are skipped and the
  # gate passes. This is what lets a path-scoped check be a required check.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect server changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qE '^tchalanet-server/|^\.github/workflows/server-pr\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  server-verify:
    name: Server verify
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-server

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Blocking gates. These are deterministic and the codebase is clean on
      # them; a violation should fail the PR rather than accrue silently.
      - name: Spotless check
        run: ./mvnw -B spotless:check

      - name: Maven verify
        run: ./mvnw -B -DskipITs=true verify

      - name: Checkstyle
        run: ./mvnw -B checkstyle:check

      # PMD gates on correctness (priority 1-4); complexity advisories are
      # priority 5 and only reported (see tchalanet-server/pmd/ruleset.xml).
      - name: PMD
        run: ./mvnw -B pmd:check

      # SpotBugs stays advisory until its findings are triaged to zero.
      - name: SpotBugs
        continue-on-error: true
        run: ./mvnw -B spotbugs:check

      - name: Jacoco coverage comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@50d3aff4548aa991e6753342d9ba291084e63848 # v1.7.2
        with:
          paths: |
            tchalanet-server/tchalanet-common/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-catalog/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-platform/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-core/target/site/jacoco/jacoco.xml,
            tchalanet-server/tchalanet-app/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 20
          min-coverage-changed-files: 50
          title: "## Coverage Report"
          update-comment: true

      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-jacoco-reports
          path: |
            tchalanet-server/**/target/site/jacoco/**
            tchalanet-server/**/target/jacoco.exec
          if-no-files-found: warn

  # Required check. Always runs; green unless server-verify actually failed.
  # Mark "Server gate" as the required status check in the branch ruleset.
  gate:
    name: Server gate
    needs: [changes, server-verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.server-verify.result }}
        run: |
          echo "changes=$CHANGES server-verify=$VERIFY"
          if [ "$CHANGES" != "success" ]; then
            echo "change detection failed"; exit 1
          fi
          case "$VERIFY" in
            success|skipped) echo "gate ok" ;;
            *) echo "server-verify $VERIFY"; exit 1 ;;
          esac

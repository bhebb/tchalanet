name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - 'tchalanet-docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      docs_surface:
        description: 'Docs surface to build'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - internal
          - both
      deploy_public:
        description: 'Deploy public tester docs to Cloudflare Pages'
        required: true
        default: true
        type: boolean

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-public:
    runs-on: ubuntu-latest
    name: Build public MkDocs
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.docs_surface == 'public' ||
      inputs.docs_surface == 'both'

    defaults:
      run:
        working-directory: tchalanet-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mkdocs deps
        run: |
          pip install -r requirements.txt

      - name: Build public docs (strict)
        run: mkdocs build -f mkdocs.public.yml --strict

      - name: Check Cloudflare Pages metadata
        run: |
          set -euo pipefail
          test -f site-public/_headers
          test -f site-public/_redirects

      - name: Check public docs for internal leaks
        run: |
          set -euo pipefail
          if grep -R -n -E \
            --include='*.html' \
            'ARCHITECTURE|OpenSpec|ADR|Flyway|Redis|RLS|Firebase UID|Cloudflare Access|runbook|internal/|01-architecture|06-openspec|99-reference|docs/' \
            site-public/search/search_index.json site-public/sitemap.xml site-public; then
            echo "Public docs contain internal terms or paths." >&2
            exit 1
          fi

  build-internal:
    runs-on: ubuntu-latest
    name: Build internal MkDocs
    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.docs_surface == 'internal' || inputs.docs_surface == 'both')

    defaults:
      run:
        working-directory: tchalanet-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mkdocs deps
        run: pip install -r requirements.txt

      - name: Build internal docs
        run: mkdocs build -f mkdocs.internal.yml

  deploy-public:
    needs: build-public
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_public == true &&
      (inputs.docs_surface == 'public' || inputs.docs_surface == 'both')
    runs-on: ubuntu-latest
    name: Deploy public docs to Cloudflare Pages
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install mkdocs deps
        working-directory: tchalanet-docs
        run: pip install -r requirements.txt

      - name: Build public docs (strict)
        working-directory: tchalanet-docs
        run: mkdocs build -f mkdocs.public.yml --strict

      - name: Check Cloudflare Pages metadata
        working-directory: tchalanet-docs
        run: |
          set -euo pipefail
          test -f site-public/_headers
          test -f site-public/_redirects

      - name: Check public docs for internal leaks
        working-directory: tchalanet-docs
        run: |
          set -euo pipefail
          if grep -R -n -E \
            --include='*.html' \
            'ARCHITECTURE|OpenSpec|ADR|Flyway|Redis|RLS|Firebase UID|Cloudflare Access|runbook|internal/|01-architecture|06-openspec|99-reference|docs/' \
            site-public/search/search_index.json site-public/sitemap.xml site-public; then
            echo "Public docs contain internal terms or paths." >&2
            exit 1
          fi

      - name: Validate Cloudflare Pages config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_DOCS_PUBLIC || 'tchalanet-docs-public' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" >&2; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret or variable" >&2; exit 1)
          test -n "$CF_PAGES_PROJECT" || (echo "Missing Cloudflare Pages project name" >&2; exit 1)

      - name: Deploy public docs to Cloudflare Pages
        working-directory: tchalanet-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_DOCS_PUBLIC || 'tchalanet-docs-public' }}
        run: |
          npx --yes wrangler@4 pages deploy site-public \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME"

name: Edge PR Check

on:
  # No path filter: runs on every PR so the required "Edge gate" check is always
  # reported. The `changes` job gates the real work to edge-slice PRs.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: edge-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect edge changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qE '^tchalanet-edge-service/|^\.github/workflows/edge-pr\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-edge-service

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tchalanet-edge-service/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --if-present

      - name: Test
        run: pnpm test --if-present

      - name: Build
        run: pnpm build

  # Required check. Always runs; green unless the edge check actually failed.
  gate:
    name: Edge gate
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "changes=$CHANGES check=$CHECK"
          if [ "$CHANGES" != "success" ]; then
            echo "change detection failed"; exit 1
          fi
          case "$CHECK" in
            success|skipped) echo "gate ok" ;;
            *) echo "edge check $CHECK"; exit 1 ;;
          esac

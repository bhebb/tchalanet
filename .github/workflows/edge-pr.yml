name: Edge PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tchalanet-edge-service/**'
      - '.github/workflows/edge-pr.yml'
  workflow_dispatch:

concurrency:
  group: edge-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tchalanet-edge-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tchalanet-edge-service/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --if-present

      - name: Test
        run: pnpm test --if-present

      - name: Build
        run: pnpm build

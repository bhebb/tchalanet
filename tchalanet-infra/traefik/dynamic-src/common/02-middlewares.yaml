http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "no-referrer-when-downgrade"
        permissionsPolicy: "geolocation=(), microphone=(), camera=()"

    gzip:
      compress: {}

    rate-limit-api:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    rate-limit-auth:
      rateLimit:
        average: 10
        burst: 20
        period: 1s

services:
  api:
    image: ${API_IMAGE_BASE:-ghcr.io/tchalanet/api}:${IMAGE_TAG}
    container_name: ${API_CONTAINER:-${DOCKER_PREFIX:-tchl}-api}-${ENV}
    env_file:
      - ../envs/${ENV}/.env.merged
      - ../envs/${ENV}/.secrets
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      TCH_IDENTITY_PROVIDER: ${TCH_IDENTITY_PROVIDER:-firebase}
      TCH_SECURITY_USER_BOOTSTRAP_MODE: ${TCH_SECURITY_USER_BOOTSTRAP_MODE:-deny}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tchalanet-39115}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
      FIREBASE_BOOTSTRAP_ENABLED: ${FIREBASE_BOOTSTRAP_ENABLED:-false}
      FIREBASE_BOOTSTRAP_AUTO_RUN_ON_STARTUP: ${FIREBASE_BOOTSTRAP_AUTO_RUN_ON_STARTUP:-false}
      FIREBASE_BOOTSTRAP_DEFAULT_USER_PASSWORD: ${FIREBASE_BOOTSTRAP_DEFAULT_USER_PASSWORD:-Changeme1!}
      # SPRING_DATASOURCE_URL → dev: envs/dev/.env (local postgres)
      #                         staging/prod: Doppler → .secrets (Neon connection string)
      TCH_EDGE_HMAC_SECRET: ${EDGE_HMAC_SECRET:?EDGE_HMAC_SECRET is required}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase-admin.json}
      GRAFANA_OTLP_AUTH_HEADER: ${GRAFANA_OTLP_AUTH_HEADER:-}
      TCH_SERVER_SIGNING_ED25519_PRIVATE_KEY_PKCS8_BASE64: ${TCH_SERVER_SIGNING_ED25519_PRIVATE_KEY_PKCS8_BASE64:-}
      TCH_SERVER_SIGNING_ED25519_PUBLIC_KEY_SPKI_BASE64: ${TCH_SERVER_SIGNING_ED25519_PUBLIC_KEY_SPKI_BASE64:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-../../tchalanet-server/tchalanet-39115-firebase-adminsdk-fbsvc-62e904a236.json}:${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase-admin.json}:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "(curl -fsS http://127.0.0.1:${API_PORT:-8080}/api/v1/actuator/health >/dev/null 2>&1) || (wget -qO- http://127.0.0.1:${API_PORT:-8080}/api/v1/actuator/health >/dev/null 2>&1) || exit 1"]
      interval: ${API_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${API_HEALTHCHECK_TIMEOUT:-10s}
      retries: 3
      start_period: 240s
    networks:
      back: {}
      edge:
        aliases: [ "api" ]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${API_LOG_MAX_SIZE:-10m}
        max-file: ${API_LOG_MAX_FILES:-3}
    labels:
      - traefik.enable=${API_TRAEFIK_ENABLE:-true}
      - traefik.docker.network=${DOCKER_NETWORK_EDGE:-edge-${ENV}}
      - traefik.http.services.api-svc.loadbalancer.server.port=${API_PORT:-8080}

<div class="private-shell">
  <header class="top-app-bar">
    <button
      type="button"
      class="burger"
      data-testid="private-nav-toggle"
      (click)="toggleDrawer()"
      [attr.aria-label]="'nav.toggle_menu' | translate"
      [attr.aria-expanded]="drawerOpen()"
      aria-controls="private-drawer"
    >
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <tch-brand [brand]="brand()" [showName]="false" />
    @if (titleKey()) {
      <strong>{{ titleKey() | translate }}</strong>
    }
    <div class="utilities">
      <div class="projected-utilities">
        <ng-content select="[private-shell-utility]" />
      </div>
      <tch-private-notification-bell />
      <button
        type="button"
        class="mode-toggle"
        (click)="themeToggled.emit()"
        [attr.aria-label]="'nav.theme_toggle' | translate"
        [attr.aria-pressed]="darkMode()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{ themeIcon() }}</span>
      </button>
      <tch-user-menu
        [name]="userName()"
        (profile)="profileRequested.emit()"
        (logout)="logoutRequested.emit()"
      />
    </div>
  </header>

  <div class="workspace" [class.is-drawer-open]="drawerOpen()">
    <!-- Replié = dialogue modal ; déployé = panneau permanent. Fermé et hors écran, le drawer est
         `inert` pour ne pas rester dans le parcours clavier derrière le contenu. -->
    <aside
      #drawer
      id="private-drawer"
      class="drawer"
      [attr.role]="drawerModal() ? 'dialog' : null"
      [attr.aria-modal]="drawerModal() ? 'true' : null"
      [attr.aria-label]="drawerModal() ? ('nav.private.ariaLabel' | translate) : null"
      [attr.inert]="drawerHidden() ? '' : null"
    >
      @if (overlayMode()) {
        <!-- Replié : deux niveaux, grille de catégories puis panneau. La verticale manque, on
             échange le déroulé complet contre un niveau de plus. -->
        <tch-drawer-nav
          [primary]="primary()"
          [sections]="sections()"
          [secondary]="secondary()"
          [ariaLabel]="'nav.private.ariaLabel' | translate"
          [searchLabel]="'nav.private.search' | translate"
          [backLabel]="'common.back' | translate"
          [noResultLabel]="'common.searchEmpty' | translate"
          pagesLabelKey="nav.private.pages"
          (itemActivated)="closeDrawer()"
        />
      } @else {
        <!-- Déployé : accordéon, tout le modèle reste atteignable sans niveau supplémentaire. -->
        <tch-sidebar-nav
          [primary]="primary()"
          [sections]="sections()"
          [secondary]="secondary()"
          [ariaLabel]="'nav.private.ariaLabel' | translate"
        />
      }
    </aside>

    <div class="backdrop" (click)="closeDrawer()" aria-hidden="true"></div>

    <main #content class="content">
      <ng-content select="[private-shell-before-content]" />
      <tch-shell-feedback-outlet [verbosity]="feedbackVerbosity()" />
      <ng-content />
    </main>
  </div>
</div>

<tch-admin-section-card title="Résultat" icon="fact_check">
  <div class="console-draw-result-summary__source">
    <div class="console-draw-result-summary__logo">
      @if (logo(); as src) {
        <img [src]="src" [alt]="identity().providerName ?? 'Source'" loading="lazy" />
      } @else {
        <span>{{ providerCode() }}</span>
      }
    </div>
    <div>
      <p class="console-draw-result-summary__eyebrow">{{ providerCode() }}</p>
      <h2>{{ title() }}</h2>
    </div>
  </div>

  <div class="console-draw-result-summary__numbers" aria-label="Numéros gagnants">
    @for (number of numbers(); track $index) {
      <span>{{ number }}</span>
    }
  </div>

  <tch-console-facts [facts]="facts().resultFacts" />
</tch-admin-section-card>

<tch-admin-section-card title="Tirage lié" icon="event">
  <tch-console-facts [facts]="facts().linkedDrawFacts" />
</tch-admin-section-card>

<article
  class="tch-metric"
  [class.tch-metric--accent]="tone() === 'accent'"
  [class.tch-metric--negative]="tone() === 'negative'"
>
  <span class="tch-metric__label">{{ label() }}</span>
  <strong class="tch-metric__value">{{ value() }}</strong>
  @if (hint(); as hintText) {
    <span class="tch-metric__hint">{{ hintText }}</span>
  }
</article>

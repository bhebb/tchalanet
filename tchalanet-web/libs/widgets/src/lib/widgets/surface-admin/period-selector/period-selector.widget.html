<section class="period-selector" [attr.aria-label]="titleKey() | tchLabel">
  <div class="period-selector__heading">
    <span class="period-selector__title">{{ titleKey() | tchLabel }}</span>
    @if (dateRange(); as range) {
      <span class="period-selector__selection">
        <span class="material-symbols-outlined" aria-hidden="true">calendar_today</span>
        {{ periodLabelKey(selectedPeriod()) | tchLabel }} · {{ range }}
      </span>
    }
  </div>
  <div
    class="period-selector__options"
    role="group"
    [attr.aria-label]="titleKey() | tchLabel"
  >
    @for (period of options(); track period) {
      <a
        class="period-selector__option"
        [routerLink]="[]"
        [queryParams]="period === 'TODAY' ? { period: null } : { period: period }"
        queryParamsHandling="merge"
        [class.period-selector__option--selected]="selectedPeriod() === period"
        [attr.aria-current]="selectedPeriod() === period ? 'page' : null"
      >
        {{ periodLabelKey(period) | tchLabel }}
      </a>
    }
  </div>
</section>

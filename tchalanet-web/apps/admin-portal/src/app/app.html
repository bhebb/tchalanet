@if (showShell()) {
  <tch-private-shell-layout
    [brand]="brand"
    [primary]="primary()"
    [titleKey]="titleKey"
    [sections]="sections()"
    [secondary]="footer()"
    [userName]="userName()"
    [darkMode]="darkMode()"
    (themeToggled)="toggleTheme()"
    (profileRequested)="goToProfile()"
    (logoutRequested)="logout()"
  >
    @if (supportSession(); as session) {
      <section
        private-shell-before-content
        class="admin-portal__support-banner"
        data-testid="support-access-banner"
      >
        <span class="material-symbols-outlined" aria-hidden="true">support_agent</span>
        <span class="admin-portal__support-copy">
          <strong class="admin-portal__support-title" data-testid="support-access-tenant-name">
            {{ 'surface.supportAccess.activeLabel' | translate: { tenant: session.tenantName } }}
          </strong>
          <span class="admin-portal__support-mode">{{ supportModeKey(session.mode) | translate }}</span>
        </span>
        <button
          class="admin-portal__support-return"
          type="button"
          data-testid="support-access-return"
          (click)="returnToPlatform()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
          {{ 'surface.supportAccess.backToPlatform' | translate }}
        </button>
      </section>
    }
    <router-outlet />
  </tch-private-shell-layout>
} @else {
  <main class="admin-portal">
    <router-outlet />
  </main>
}
<tch-theme-sandbox />

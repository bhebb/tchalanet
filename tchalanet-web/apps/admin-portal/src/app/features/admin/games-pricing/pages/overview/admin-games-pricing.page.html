<tch-admin-page-shell
  [title]="'admin.gamesPricing.title' | translate"
  [description]="'admin.gamesPricing.description' | translate"
>
  <div actions>
    <a mat-stroked-button routerLink="/app/admin/setup" class="gp-page__back-btn">
      <span class="material-symbols-outlined">arrow_back</span>
      {{ 'admin.gamesPricing.action.backToSetup' | translate }}
    </a>
    <button mat-stroked-button (click)="load()">
      <span class="material-symbols-outlined">refresh</span>
      {{ 'admin.gamesPricing.action.refresh' | translate }}
    </button>
  </div>

  <tch-async-view
    [resource]="gamesResource"
    [error]="gamesError()"
    [loadingLabel]="'admin.gamesPricing.loading' | translate"
    [retryLabel]="'common.retry' | translate"
    (retry)="load()"
  >
    <tch-admin-empty-state
      empty
      icon="casino"
      [title]="'admin.gamesPricing.empty.title' | translate"
      [message]="'admin.gamesPricing.empty.message' | translate"
    />

    <ng-template tchAsyncReady>
      <tch-games-setup-summary [items]="summaryItems()" />

      @if (issues().length > 0) {
        <tch-games-setup-issues
          [issues]="issues()"
          (issueAction)="onIssueAction($event)"
        />
      }

      <tch-tenant-games-grid
        [games]="games()"
        [actionErrors]="actionErrors()"
        (activate)="onActivate($event)"
        (disable)="onDisable($event)"
        (configure)="onConfigure($event)"
      />
    </ng-template>
  </tch-async-view>
</tch-admin-page-shell>

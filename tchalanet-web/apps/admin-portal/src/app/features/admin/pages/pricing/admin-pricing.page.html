<tch-admin-page-shell
  [title]="'admin.pricing.title' | translate"
  [description]="'admin.pricing.description' | translate"
>
  <div actions>
    <button mat-stroked-button [disabled]="loading()" (click)="load()">
      <span class="material-symbols-outlined">refresh</span>
      {{ 'common.refresh' | translate }}
    </button>
  </div>

  @if (loading()) {
    <tch-loading [label]="'common.loading' | translate" />
  } @else if (error(); as errorVm) {
    <tch-error-panel
      [title]="errorVm.title"
      [message]="errorVm.message"
      [showRetry]="true"
      [retryLabel]="'common.retry' | translate"
      (retry)="load()"
    />
  } @else if (odds().length === 0) {
    <tch-admin-empty-state
      icon="casino"
      [title]="'admin.pricing.empty.title' | translate"
      [message]="'admin.pricing.empty.message' | translate"
    />
  } @else {
    <tch-console-pricing-table [rows]="rows()" [showActions]="false" />
  }
</tch-admin-page-shell>

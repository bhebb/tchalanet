<tch-admin-page-shell
  [title]="'admin.games.title' | translate"
  [description]="'admin.games.description' | translate"
>
  <mat-tab-group>
    <mat-tab [label]="'admin.games.tabs.enabled' | translate">
      @if (loadingGames()) {
        <tch-loading [label]="'common.loading' | translate" />
      } @else if (errorGames(); as gamesError) {
        <tch-error-panel
          [title]="gamesError.title"
          [message]="gamesError.message"
          [showRetry]="true"
          [retryLabel]="'common.retry' | translate"
          (retry)="loadGames()"
        />
      } @else if (games().length === 0) {
        <tch-admin-empty-state
          icon="casino"
          [title]="'admin.games.empty.enabled.title' | translate"
          [message]="'admin.games.empty.enabled.message' | translate"
        />
      } @else {
        <tch-console-games-table
          [rows]="gameRows()"
          [showSortOrder]="true"
          (rowAction)="onTenantGameAction($event)"
        />
      }
    </mat-tab>

    <mat-tab [label]="'admin.games.tabs.catalog' | translate">
      @if (loadingCatalog()) {
        <tch-loading [label]="'common.loading' | translate" />
      } @else if (errorCatalog(); as catalogError) {
        <tch-error-panel
          [title]="catalogError.title"
          [message]="catalogError.message"
          [showRetry]="true"
          [retryLabel]="'common.retry' | translate"
          (retry)="loadCatalog()"
        />
      } @else if (catalog().length === 0) {
        <tch-admin-empty-state
          icon="inventory"
          [title]="'admin.games.empty.catalog.title' | translate"
          [message]="'admin.games.empty.catalog.message' | translate"
        />
      } @else {
        <tch-console-games-table
          [rows]="catalogRows()"
          (rowAction)="onCatalogGameAction($event)"
        />
      }
    </mat-tab>
  </mat-tab-group>
</tch-admin-page-shell>

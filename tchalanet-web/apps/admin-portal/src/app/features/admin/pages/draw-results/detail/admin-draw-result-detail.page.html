<tch-console-entity-detail
  [title]="title()"
  [description]="description()"
  [state]="pageState()"
  loadingLabel="Chargement du résultat..."
  [error]="detailError()"
  [meta]="detailMeta()"
  [actions]="detailActions()"
  (retry)="load()"
  (action)="onDetailAction($event)"
>
  @if (result()) {
    <ng-container main>
      <tch-admin-section-card title="Résultat" icon="fact_check">
        <div class="draw-result-detail__source">
          <div class="draw-result-detail__logo">
            @if (providerLogo(result()!); as logo) {
              <img [src]="logo" [alt]="result()!.channelName ?? result()!.provider ?? 'Source'" loading="lazy" />
            } @else {
              <span>{{ providerCode(result()!) }}</span>
            }
          </div>
          <div>
            <p class="draw-result-detail__eyebrow">{{ providerCode(result()!) }}</p>
            <h2>{{ result()!.channelName ?? result()!.provider ?? result()!.slotKey }}</h2>
          </div>
        </div>

        <div class="draw-result-detail__numbers" aria-label="Numéros gagnants">
          @for (number of result()!.numbers ?? []; track number) {
            <span>{{ number }}</span>
          }
        </div>

        <tch-console-facts [facts]="resultFacts()" />
      </tch-admin-section-card>

      <tch-admin-section-card title="Tirage lié" icon="event">
        <tch-console-facts [facts]="linkedDrawFacts()" />
      </tch-admin-section-card>
    </ng-container>

    <ng-container aside>
      <tch-identity-card
        eyebrow="Résumé"
        [title]="result()!.slotLabel ?? result()!.slotKey ?? 'Résultat'"
        [code]="providerCode(result()!)"
        [status]="statusLabel(result()!.status)"
        [statusTone]="statusTone(result()!.status)"
        [meta]="identityMeta()"
        icon="fact_check"
        variant="compact"
      />
    </ng-container>
  }
</tch-console-entity-detail>

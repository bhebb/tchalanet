<mat-form-field appearance="outline" subscriptSizing="dynamic" class="draw-channel-filter">
  <mat-label>{{ label() }}</mat-label>
  <mat-select [value]="selectedKey()" (valueChange)="onValueChange($event)">
    <mat-option value="">{{ allLabel() }}</mat-option>
    @for (option of options(); track option.key) {
      <mat-option [value]="option.key">
        {{ option.label }}
        <span class="draw-channel-filter__hint">{{ option.hint }}</span>
      </mat-option>
    }
  </mat-select>
</mat-form-field>

<div class="tch-metric-grid">
  <tch-admin-metric-card
    icon="calendar_today"
    tone="info"
    label="Tirages aujourd'hui"
    actionLabel="Filtrer sur les tirages d'aujourd'hui"
    [value]="todayValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('today')"
  />

  <tch-admin-metric-card
    icon="shopping_cart"
    tone="positive"
    label="Ouverts à la vente"
    actionLabel="Filtrer sur les tirages ouverts à la vente"
    [value]="salesOpenValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('salesOpen')"
  />

  <tch-admin-metric-card
    icon="hourglass_empty"
    tone="warning"
    label="Résultats attendus"
    actionLabel="Filtrer sur les résultats attendus"
    [value]="expectedValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('expected')"
  />

  <tch-admin-metric-card
    icon="verified"
    tone="positive"
    label="Résultats confirmés"
    actionLabel="Filtrer sur les résultats confirmés"
    [value]="confirmedValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('confirmed')"
  />
</div>

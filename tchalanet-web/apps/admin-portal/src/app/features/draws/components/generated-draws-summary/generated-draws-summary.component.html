<div class="tch-metric-grid">
  <tch-admin-metric-card
    icon="calendar_today"
    tone="info"
    [label]="'admin.generatedDraws.summary.today' | translate"
    [actionLabel]="'admin.generatedDraws.summaryAction.today' | translate"
    [value]="todayValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('today')"
  />

  <tch-admin-metric-card
    icon="shopping_cart"
    tone="positive"
    [label]="'admin.generatedDraws.summary.salesOpen' | translate"
    [actionLabel]="'admin.generatedDraws.summaryAction.salesOpen' | translate"
    [value]="salesOpenValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('salesOpen')"
  />

  <tch-admin-metric-card
    icon="hourglass_empty"
    tone="warning"
    [label]="'admin.generatedDraws.summary.resultsExpected' | translate"
    [actionLabel]="'admin.generatedDraws.summaryAction.resultsExpected' | translate"
    [value]="expectedValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('expected')"
  />

  <tch-admin-metric-card
    icon="verified"
    tone="positive"
    [label]="'admin.generatedDraws.summary.confirmed' | translate"
    [actionLabel]="'admin.generatedDraws.summaryAction.confirmed' | translate"
    [value]="confirmedValue()"
    [interactive]="true"
    (action)="kpiSelected.emit('confirmed')"
  />
</div>

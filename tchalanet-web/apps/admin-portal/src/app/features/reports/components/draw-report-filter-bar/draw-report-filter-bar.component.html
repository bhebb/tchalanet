<section class="draw-report-filter-bar" [attr.aria-label]="'admin.reports.draws.filters.aria' | translate">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ 'admin.reports.draws.filters.from' | translate }}</mat-label>
    <input matInput type="date" [value]="from()" (change)="fromChange.emit($any($event.target).value)" />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ 'admin.reports.draws.filters.to' | translate }}</mat-label>
    <input matInput type="date" [value]="to()" (change)="toChange.emit($any($event.target).value)" />
  </mat-form-field>

  <tch-multi-search-select
    class="draw-report-filter-bar__draws"
    [label]="'admin.reports.draws.filters.draws' | translate"
    [placeholder]="'admin.reports.draws.filters.drawsPlaceholder' | translate"
    [hint]="'admin.reports.draws.filters.drawsHint' | translate"
    icon="event"
    [minChars]="2"
    [searchFn]="searchDraws()"
    (valueChange)="drawsChange.emit($event)"
  />

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ 'admin.reports.draws.filters.sort' | translate }}</mat-label>
    <mat-select [value]="sort()" (valueChange)="sortChange.emit($event)">
      @for (option of sortOptions(); track option.value) {
        <mat-option [value]="option.value">{{ option.labelKey | translate }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</section>

<h2 mat-dialog-title>{{ 'admin.subscription.dialog.cancel.title' | translate }}</h2>

<mat-dialog-content>
  <p class="cancel-subscription-dialog__warning">
    {{ 'admin.subscription.dialog.cancel.warning' | translate }}
  </p>
  <form [formGroup]="form" class="cancel-subscription-dialog__form">
    <mat-form-field appearance="outline" class="cancel-subscription-dialog__field">
      <mat-label>{{ 'admin.subscription.dialog.cancel.reason' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="reason"
        rows="2"
        [placeholder]="'admin.subscription.dialog.cancel.reasonPlaceholder' | translate"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button mat-flat-button color="warn" (click)="submit()">
    {{ 'admin.subscription.dialog.cancel.confirm' | translate }}
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>{{ 'admin.pricing.dialog.edit.title' | translate }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="edit-tenant-odds-dialog__form">
    <div class="edit-tenant-odds-dialog__identity">
      <span>{{ data.gameCode }}</span>
      <span>{{ data.betType }}</span>
      <span>{{ data.pricingVariantCode }}</span>
    </div>

    <mat-form-field appearance="outline" class="edit-tenant-odds-dialog__field">
      <mat-label>{{ 'console.pricingForm.field.odds' | translate }}</mat-label>
      <input matInput type="number" formControlName="odds" min="0.0001" step="0.01" />
      @if (form.controls.odds.invalid && form.controls.odds.touched) {
        <mat-error>{{ 'console.pricingForm.validation.oddsMin' | translate }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="submit()">
    {{ 'common.save' | translate }}
  </button>
</mat-dialog-actions>

<tch-admin-page-shell
  [title]="'admin.pricing.title' | translate"
  [description]="'admin.pricing.description' | translate"
>
  <div actions>
    <a mat-stroked-button routerLink="/app/admin/setup">
      <span class="material-symbols-outlined">arrow_back</span>
      {{ 'admin.pricing.actions.backToSetup' | translate }}
    </a>
    <a mat-stroked-button routerLink="/app/admin/games">
      <span class="material-symbols-outlined">casino</span>
      {{ 'admin.pricing.actions.backToGames' | translate }}
    </a>
    <button mat-stroked-button (click)="load()">
      <span class="material-symbols-outlined">refresh</span>
      {{ 'common.refresh' | translate }}
    </button>
  </div>

  <tch-async-view
    [resource]="oddsResource"
    [error]="oddsError()"
    [loadingLabel]="'common.loading' | translate"
    [retryLabel]="'common.retry' | translate"
    (retry)="load()"
  >
    <tch-admin-empty-state
      empty
      icon="casino"
      [title]="'admin.pricing.empty.title' | translate"
      [message]="'admin.pricing.empty.message' | translate"
    />

    <ng-template tchAsyncReady>
      @if (odds(); as oddsVm) {
        @if (oddsVm.length > 0) {
          <tch-console-pricing-table [rows]="rows()" (rowAction)="onRowAction($event)" />
        }
      }
    </ng-template>
  </tch-async-view>
</tch-admin-page-shell>

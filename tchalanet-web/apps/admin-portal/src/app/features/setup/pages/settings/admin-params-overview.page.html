<tch-admin-page-shell
  [title]="'admin.settings.overview.title' | translate"
  [description]="'admin.settings.overview.description' | translate"
>
  <div actions>
    <a mat-stroked-button [routerLink]="backRoute">
      <span class="material-symbols-outlined">arrow_back</span>
      {{ backLabel | translate }}
    </a>
    <button mat-stroked-button [disabled]="config.isLoading()" (click)="config.reload()">
      <span class="material-symbols-outlined">refresh</span>
      {{ 'common.refresh' | translate }}
    </button>
  </div>

  <tch-async-view
    [resource]="config"
    [error]="configError()"
    [isEmpty]="configIsEmpty"
    [loadingLabel]="'common.loading' | translate"
    (retry)="config.reload()"
  >
    <ng-template tchAsyncReady>
      <div class="params-overview">
        @for (section of sections(); track section.id) {
          <tch-settings-summary-card [section]="section" />
        }
      </div>
    </ng-template>
  </tch-async-view>
</tch-admin-page-shell>

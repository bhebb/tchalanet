<tch-admin-page-shell
  [title]="'admin.setup.title' | translate"
  [description]="'admin.setup.description' | translate"
>
  <div actions>
    <button mat-stroked-button [disabled]="loading()" (click)="load()">
      <mat-icon>refresh</mat-icon>
      {{ 'common.refresh' | translate }}
    </button>
  </div>

  @if (loading()) {
    <tch-loading [label]="'admin.setup.loading' | translate" />
  } @else if (error()) {
    <tch-error-panel [title]="error()!" [showRetry]="true" [retryLabel]="'common.retry' | translate" (retry)="load()" />
  } @else {

    <tch-setup-progress-header
      [completed]="requiredCompletedCount()"
      [total]="requiredTotalCount()"
      [pct]="progressPct()"
      [complete]="setup()?.status === 'COMPLETE'"
    />

    <div class="setup__grid" data-testid="admin-setup-checklist">
      @for (card of setupCards(); track card.id) {
        <tch-setup-checklist-card
          [attr.data-testid]="'admin-setup-card-' + card.id"
          [icon]="card.icon"
          [titleKey]="card.titleKey"
          [status]="card.status"
          [badgeKind]="card.badgeKind"
          [body]="card.body"
          [bodyVariant]="card.bodyVariant"
          [ctaKey]="card.ctaKey"
          [route]="card.route"
          [queryParams]="card.queryParams"
          [fragment]="card.fragment"
          [emphasizeMissing]="card.emphasizeMissing"
          [sectionErrors]="sectionErrorsFor(card.sectionErrorTargets)"
        />
      }
    </div>

    <tch-setup-seller-terminal-card
      [unlocked]="canCreateSellerTerminal()"
      [blockingSteps]="terminalBlockingSteps()"
      [sectionError]="sectionError('admin.setup.sellerTerminal')"
    />
  }
</tch-admin-page-shell>

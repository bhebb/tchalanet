@let s = slot();

<div class="slot-row" [class.slot-row--inactive]="!s.enabled" [class.slot-row--needs-config]="s.enabled && !s.drawTime">

  <div class="slot-row__left">
    <span class="slot-row__index">{{ (index() + 1).toString().padStart(2, '0') }}</span>
    <tch-draw-label
      density="compact"
      [eyebrow]="'domain.draw.field.slotType' | translate"
      [primary]="s.label"
      [secondary]="s.slotKey"
      [meta]="s.drawTime ? (s.drawTime | slice:0:5) : null"
    />
  </div>

  <div class="slot-row__right">
    @if (s.drawTime) {
      <code class="slot-row__time">{{ s.drawTime | slice:0:5 }}</code>
    } @else {
      <span class="slot-row__time slot-row__time--missing">—</span>
    }

    <tch-status-badge
      [status]="slotStatus(s)"
      [label]="slotStatusLabelKey(s) | translate"
    />

    <button
      mat-icon-button
      class="slot-row__edit-btn"
      (click)="configure.emit(s)"
      [attr.aria-label]="'admin.drawChannels.actions.configure' | translate"
    >
      <span class="material-symbols-outlined">edit</span>
    </button>
  </div>

</div>

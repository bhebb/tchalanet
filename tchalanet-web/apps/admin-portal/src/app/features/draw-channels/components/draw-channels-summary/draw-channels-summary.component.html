<p class="draw-channels-summary" [attr.aria-label]="'admin.drawChannels.summary.aria' | translate">
  <span class="draw-channels-summary__item">
    <span class="draw-channels-summary__value">{{ totalCount() }}</span>
    <span>{{ 'admin.drawChannels.summary.availableStates' | translate }}</span>
  </span>
  <span aria-hidden="true">·</span>
  <span class="draw-channels-summary__item">
    <span class="draw-channels-summary__value">{{ activeChannels() }}</span>
    <span>{{ 'admin.drawChannels.summary.activeChannels' | translate }}</span>
  </span>
  <span aria-hidden="true">·</span>
  <span class="draw-channels-summary__item">
    <span class="draw-channels-summary__value">{{ todoCount() }}</span>
    <span>{{ 'admin.drawChannels.summary.todo' | translate }}</span>
  </span>
</p>

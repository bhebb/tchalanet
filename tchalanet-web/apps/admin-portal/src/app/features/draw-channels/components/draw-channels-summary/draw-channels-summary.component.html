<div class="tch-metric-grid">
  <tch-admin-metric-card
    icon="map"
    tone="info"
    [label]="'admin.drawChannels.summary.availableStates' | translate"
    [value]="totalCount().toString()"
  />

  <tch-admin-metric-card
    icon="check_circle"
    tone="positive"
    [label]="'admin.drawChannels.summary.activeStates' | translate"
    [value]="activeCount().toString()"
  />

  <tch-admin-metric-card
    icon="confirmation_number"
    [label]="'admin.drawChannels.summary.activeChannels' | translate"
    [value]="activeChannels().toString()"
  />

  <tch-admin-metric-card
    icon="error_outline"
    tone="warning"
    [label]="'admin.drawChannels.summary.todo' | translate"
    [value]="todoCount().toString()"
  />
</div>

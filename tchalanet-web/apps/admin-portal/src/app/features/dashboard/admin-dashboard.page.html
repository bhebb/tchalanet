@let vm = state();

<section class="admin-dashboard">
  @switch (vm.status) {
    @case ('loading') {
      <tch-loading [label]="'common.loading' | translate" />
    }
    @case ('error') {
      <tch-error-panel
        [title]="'common.error.title' | translate"
        [message]="'dashboard.loadError' | translate"
        [showRetry]="true"
        [retryLabel]="'common.retry' | translate"
        (retry)="reload()"
      />
    }
    @case ('ready') {
      <tch-page-model
        [content]="vm.response.content"
        [dynamic]="vm.response.dynamic"
        (widgetRetry)="reload()"
      />
    }
  }
</section>

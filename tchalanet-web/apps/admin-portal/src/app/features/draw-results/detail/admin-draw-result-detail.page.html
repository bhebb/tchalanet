<tch-console-entity-detail
  [title]="title()"
  [description]="description()"
  [state]="pageState()"
  loadingLabel="Chargement du résultat..."
  [error]="detailError()"
  [meta]="detailMeta()"
  [actions]="detailActions()"
  (retry)="load()"
  (action)="onDetailAction($event)"
>
  @if (result(); as result) {
    <ng-container main>
      <mat-tab-group class="draw-result-detail__tabs" animationDuration="120ms">
        <mat-tab [label]="'admin.drawResults.detail.tab.results' | translate">
          <tch-draw-result-summary
            [result]="result"
            [resultFacts]="resultFacts()"
            [linkedDrawFacts]="linkedDrawFacts()"
          />
        </mat-tab>

        <mat-tab [label]="'admin.drawResults.detail.tab.combinations' | translate">
          <tch-draw-result-combinations [rows]="combinationRows()" />
        </mat-tab>

        <mat-tab [label]="'admin.drawResults.detail.tab.raw' | translate">
          <tch-draw-result-raw [content]="rawResult()" />
        </mat-tab>
      </mat-tab-group>
    </ng-container>
  }

  @if (result(); as result) {
    <ng-container aside>
      <tch-identity-card
        eyebrow="Résumé"
        [title]="result.slotLabel ?? result.slotKey ?? 'Résultat'"
        [code]="providerCode(result)"
        [status]="statusLabel(result.status)"
        [statusTone]="statusTone(result.status)"
        [meta]="identityMeta()"
        icon="fact_check"
        variant="compact"
      />
    </ng-container>
  }
</tch-console-entity-detail>

<tch-console-entity-detail
  [title]="title()"
  [description]="description()"
  [state]="pageState()"
  [loadingLabel]="'admin.drawResults.detail.loading' | translate"
  [error]="detailError()"
  [meta]="detailMeta()"
  [actions]="detailActions()"
  (retry)="load()"
  (action)="onDetailAction($event)"
>
  @if (result(); as result) {
    <ng-container main>
      <mat-tab-group class="draw-result-detail__tabs" animationDuration="120ms">
        <mat-tab [label]="'admin.drawResults.detail.tab.results' | translate">
          @if (summaryView(); as summary) {
            <tch-console-draw-result-summary
              [summary]="summary"
              [facts]="summaryFacts()"
            />
          }
        </mat-tab>

        <mat-tab [label]="'admin.drawResults.detail.tab.combinations' | translate">
          <tch-console-draw-result-combinations [rows]="combinationSections()" />
        </mat-tab>

        <mat-tab [label]="'admin.drawResults.detail.tab.raw' | translate">
          <tch-console-draw-result-raw
            [content]="rawResult()"
            [emptyLabel]="'admin.drawResults.detail.raw.empty' | translate"
          />
        </mat-tab>
      </mat-tab-group>
    </ng-container>
  }

  @if (result(); as result) {
    <ng-container aside>
      <tch-identity-card
        [eyebrow]="'admin.drawResults.detail.summary' | translate"
        [title]="title()"
        [code]="providerCode(result)"
        [status]="statusLabel(result.status)"
        [statusTone]="statusTone(result.status)"
        [meta]="identityMeta()"
        icon="fact_check"
        variant="compact"
      />
    </ng-container>
  }
</tch-console-entity-detail>

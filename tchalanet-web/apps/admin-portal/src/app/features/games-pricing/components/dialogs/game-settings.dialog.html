<tch-admin-dialog-shell
  [title]="'admin.games.settings.title' | translate: { name: (data.game.gameCode | consoleGameName:(data.game.displayName ?? data.game.catalogName)) }"
  [description]="'admin.games.settings.description' | translate"
  icon="tune"
>
  @if (feedback()?.kind === 'error' && feedback()?.vm; as errorVm) {
  <tch-section-error
    [title]="errorVm.title"
    [message]="errorVm.message"
    [severity]="errorVm.severity"
  />
  }

  <tch-game-settings-editor
    [game]="data.game"
    [form]="form"
    [model]="model()"
    [betOptionConfig]="betOptionConfig()"
    [pricingGroups]="pricingGroups()"
    [betOptionLoading]="betOptionLoading()"
    [betOptionLoadFailed]="betOptionLoadFailed()"
    [editingPricingVariantKey]="editingPricingVariantKey()"
    [showSalesOptions]="showSalesOptions()"
    [selectionPolicies]="selectionPolicies"
    [stakeErrorKey]="stakeErrorKey()"
    (submitted)="submit($event)"
    (selectionPolicyChange)="updateSelectionPolicy($event.betType, $event.selectionPolicy)"
    (defaultOptionChange)="updateDefaultOption($event.betType, $event.defaultOption)"
    (optionEnabledChange)="toggleOptionEnabled($event.betType, $event.optionCode, $event.checked)"
    (optionVisibleInPosChange)="toggleOptionVisibleInPos($event.betType, $event.optionCode, $event.checked)"
    (pricingVariantEdit)="editPricingVariant($event.groupId, $event.pricingVariantCode, $event.label)"
    (pricingRuleTypeChange)="updatePricingRuleType($event.groupId, $event.pricingVariantCode, $event.payoutRuleType)"
    (pricingOddsChange)="updatePricingOdds($event.groupId, $event.pricingVariantCode, $event.rawValue)"
    (pricingFixedAmountChange)="updatePricingFixedAmount($event.groupId, $event.pricingVariantCode, $event.rawValue)"
    (clearPricingRequested)="requestClearPricingOdds($event.groupId, $event.pricingVariantCode, $event.label)"
  />

  <button
    actions
    mat-button
    type="button"
    [disabled]="saveSettings.pending()"
    (click)="requestCancel()"
  >
    {{ 'common.cancel' | translate }}
  </button>
  <button
    actions
    mat-flat-button
    color="primary"
    type="submit"
    [disabled]="form().invalid() || !!stakeErrorKey() || saveSettings.pending()"
    (click)="submit($event)"
  >
    @if (saveSettings.pending()) {
    <span class="material-symbols-outlined tch-admin-dialog-spinner" aria-hidden="true"
      >progress_activity</span
    >
    } {{ 'common.save' | translate }}
  </button>
</tch-admin-dialog-shell>

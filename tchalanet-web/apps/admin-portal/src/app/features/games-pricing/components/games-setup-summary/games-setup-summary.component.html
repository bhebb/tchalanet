<section class="tch-metric-grid" [attr.aria-label]="'admin.gamesPricing.summary.aria' | translate">
  @for (item of items(); track item.labelKey) {
    <tch-admin-metric-card
      [label]="item.labelKey | translate"
      [value]="item.value.toString()"
      [hint]="item.helpKey | translate"
      [tone]="cardTone(item)"
    />
  }
</section>

<p class="games-setup-summary" [attr.aria-label]="'admin.gamesPricing.summary.aria' | translate">
  @for (item of items(); track item.labelKey) {
    <span class="games-setup-summary__item games-setup-summary__item--{{ item.tone ?? 'neutral' }}">
      <span class="games-setup-summary__value">{{ item.value }}</span>
      <span>{{ item.labelKey | translate }}</span>
    </span>
    @if (!$last) {
      <span aria-hidden="true">·</span>
    }
  }
</p>

<div class="tch-metric-grid">
  <tch-admin-metric-card
    icon="check_circle"
    tone="positive"
    label="Jeux actifs"
    [value]="activeCount().toString()"
    [hint]="'sur ' + totalCount() + ' disponibles'"
  />

  <tch-admin-metric-card
    icon="pending_actions"
    tone="warning"
    label="À configurer"
    [value]="todoCount().toString()"
    [hint]="todoCount() > 1 ? 'jeux en attente' : 'jeu en attente'"
  />

  <tch-admin-metric-card
    icon="dashboard_customize"
    label="Disponibles"
    [value]="availableCount().toString()"
    [hint]="availableCount() > 1 ? 'nouvelles options' : 'nouvelle option'"
  />
</div>

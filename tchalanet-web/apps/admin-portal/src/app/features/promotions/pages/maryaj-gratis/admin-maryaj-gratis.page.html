<tch-admin-page-shell
  [title]="'admin.maryajGratis.title' | translate"
  [description]="'admin.maryajGratis.description' | translate"
>
  <div actions>
    <tch-admin-refresh-button
      [label]="'admin.maryajGratis.action.refresh' | translate"
      [disabled]="store.state() === 'loading' || store.saving()"
      [busy]="store.state() === 'loading'"
      (refreshRequested)="store.load()"
    />
  </div>

  @if (store.state() === 'loading') {
  <tch-loading [label]="'admin.maryajGratis.loading' | translate" />
  } @else if (store.state() === 'error' && store.pageError(); as pageError) {
  <tch-error-panel
    [title]="pageError.title"
    [message]="pageError.message"
    [showRetry]="true"
    [retryLabel]="'common.retry' | translate"
    (retry)="store.load()"
  />
  } @else { @if (store.gamesError(); as gamesError) {
  <tch-section-error
    [title]="gamesError.title"
    [message]="gamesError.message"
    [severity]="gamesError.severity"
  />
  } @if (store.campaignDetailError(); as detailError) {
  <tch-section-error
    [title]="detailError.title"
    [message]="detailError.message"
    [severity]="detailError.severity"
  />
  } @if (store.actionError(); as actionError) {
  <tch-section-error
    [title]="actionError.title"
    [message]="actionError.message"
    [severity]="actionError.severity"
  />
  }
  <div class="maryaj-page__stack" data-testid="admin-maryaj-gratis-page">
    <tch-maryaj-game-settings-panel
      [game]="store.maryajGame()"
      [saving]="store.saving()"
      (activate)="store.enableGame($event)"
      (disable)="confirmDisableGame($event)"
      (configure)="openGameSettings($event)"
    />
    <tch-maryaj-offer-panel
      [campaign]="store.maryajCampaign() ?? null"
      [effect]="store.maryajEffect()"
      [form]="store.form"
      [saving]="store.saving()"
      [gameReady]="store.isMaryajGameReady()"
      [editing]="store.editingOffer()"
      (activateCampaign)="store.activate($event)"
      (pauseCampaign)="confirmPauseOffer($event)"
      (instantiateOffer)="store.instantiate()"
      (editOffer)="store.startEditingOffer()"
      (cancelEdit)="store.cancelEditingOffer()"
      (saveOffer)="store.saveOffer()"
      (addQuantityTier)="store.addQuantityTier()"
      (removeQuantityTier)="store.removeQuantityTier($event)"
    />
    <tch-maryaj-generation-panel
      [effect]="store.maryajEffect()"
      [form]="store.form"
      [editing]="store.editingOffer()"
      (manualSelectionChange)="store.setSellerSelectionEnabled($event)"
    />
  </div>
  }
</tch-admin-page-shell>

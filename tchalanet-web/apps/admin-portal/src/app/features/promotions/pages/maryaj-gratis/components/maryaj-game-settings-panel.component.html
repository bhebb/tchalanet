@if (game(); as game) {
  <section
    id="game"
    class="maryaj-game-settings maryaj-game-settings--card"
    data-testid="maryaj-gratis-game-panel"
    [attr.aria-label]="'admin.maryajGratis.game.title' | translate"
  >
    <tch-tenant-game-card
      [game]="game"
      [saving]="saving()"
      (activate)="activate.emit($event)"
      (disable)="disable.emit($event)"
      (configure)="onConfigure($event)"
    />
  </section>
} @else {
  <tch-admin-section-card
    id="game"
    class="maryaj-game-settings"
    data-testid="maryaj-gratis-game-panel"
    icon="casino"
    [title]="'admin.maryajGratis.game.title' | translate"
    [description]="'admin.maryajGratis.game.subtitle' | translate"
  >
    <div status>
      <tch-admin-status-pill
        [label]="'admin.maryajGratis.game.notConfigured' | translate"
        tone="warning"
      />
    </div>

    <div class="maryaj-game-settings__empty" data-testid="maryaj-gratis-game-empty">
      <mat-icon aria-hidden="true">casino</mat-icon>
      <div>
        <p class="maryaj-game-settings__empty-title">
          {{ 'admin.maryajGratis.game.empty.title' | translate }}
        </p>
        <p class="maryaj-game-settings__empty-copy">
          {{ 'admin.maryajGratis.game.empty.copy' | translate }}
        </p>
      </div>
    </div>
  </tch-admin-section-card>
}

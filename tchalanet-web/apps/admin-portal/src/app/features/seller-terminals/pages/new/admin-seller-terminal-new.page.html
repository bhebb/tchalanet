<tch-admin-page-shell
  [title]="'admin.sellerTerminals.new.title' | translate"
  [description]="'admin.sellerTerminals.new.description' | translate"
>
  <div actions>
    <a mat-stroked-button routerLink="/app/admin/seller-terminals">
      <span class="material-symbols-outlined">arrow_back</span>
      {{ 'admin.sellerTerminals.new.action.backToList' | translate }}
    </a>
  </div>

  @if (successResult(); as result) {
    <div class="stn-page__success-wrapper">
      <tch-seller-terminal-success-card
        [result]="result"
        (openPos)="onOpenPos($event)"
        (openOverrides)="onOpenOverrides($event)"
        (backToList)="goBackToList()"
        (createAnother)="onCreateAnother()"
      />
    </div>
  } @else {
    <tch-seller-terminal-create-form
      [form]="form"
      [model]="model()"
      [saving]="saving()"
      [codeLoading]="codeLoading()"
      [error]="error()"
      [showPin]="showPin()"
      [showConfirmPin]="showConfirmPin()"
      [pinMismatch]="pinMismatch()"
      (create)="onSubmit()"
      (regenerateCode)="regenerateCode()"
      (toggleShowPin)="toggleShowPin()"
      (toggleShowConfirmPin)="toggleShowConfirmPin()"
    />
  }
</tch-admin-page-shell>

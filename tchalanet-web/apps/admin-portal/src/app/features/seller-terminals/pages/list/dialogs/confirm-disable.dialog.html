<h2 mat-dialog-title>{{ 'admin.sellerTerminals.list.dialog.disable.title' | translate }}</h2>

<mat-dialog-content>
  @if (error(); as formError) {
  <tch-error-panel [title]="formError.title" [message]="formError.message" />
  }
  <p>
    {{ 'admin.sellerTerminals.list.dialog.disable.description' | translate: { name:
    data.displayName, code: data.terminalCode } }}
  </p>
  <p class="confirm-disable-dialog__warning">
    {{ 'admin.sellerTerminals.list.dialog.disable.warning' | translate }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" [disabled]="saving()">
    {{ 'common.cancel' | translate }}
  </button>
  <button mat-flat-button color="warn" [disabled]="saving()" (click)="submit()">
    {{ 'admin.sellerTerminals.list.action.disable' | translate }}
  </button>
</mat-dialog-actions>

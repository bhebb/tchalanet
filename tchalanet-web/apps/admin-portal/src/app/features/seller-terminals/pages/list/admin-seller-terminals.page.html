<tch-admin-page-shell
  [title]="'admin.sellerTerminals.list.title' | translate"
  [description]="'admin.sellerTerminals.list.description' | translate"
>
  <div actions>
    <a mat-flat-button color="primary" routerLink="/app/admin/seller-terminals/new">
      <span class="material-symbols-outlined">add</span>
      {{ 'admin.sellerTerminals.list.action.new' | translate }}
    </a>
  </div>

  @if (summary(); as s) {
    <tch-seller-terminal-kpi-strip [summary]="s" />
  }

  @if (actionError(); as actionErrorVm) {
    <tch-error-panel feedback [title]="actionErrorVm.title" [message]="actionErrorVm.message" />
  }

  <tch-async-view
    [resource]="sellers"
    [error]="sellersError()"
    [loadingLabel]="'admin.sellerTerminals.list.loading' | translate"
    [retryLabel]="'common.retry' | translate"
    (retry)="reload()"
  >
    <tch-admin-empty-state
      empty
      icon="point_of_sale"
      [title]="'admin.sellerTerminals.list.empty.title' | translate"
      [message]="'admin.sellerTerminals.list.empty.message' | translate"
    />

    <ng-template tchAsyncReady>
    <tch-admin-list-surface
      [searchLabel]="'admin.sellerTerminals.list.filter.search' | translate"
      [searchPlaceholder]="'admin.sellerTerminals.list.filter.searchPlaceholder' | translate"
      [searchValue]="searchQuery()"
      [statusLabel]="'admin.sellerTerminals.list.filter.status' | translate"
      [statusValue]="statusFilter()"
      [statusOptions]="statusOptions"
      [allStatusesLabel]="'admin.sellerTerminals.list.filter.allStatuses' | translate"
      [resetLabel]="'admin.sellerTerminals.list.filter.reset' | translate"
      [filtersExpanded]="!!statusFilter()"
      (searchChange)="onSearch($event)"
      (statusChange)="onStatusFilter($event)"
      (resetFilters)="resetFilters()"
    >
      <ng-container list-content>
          <tch-seller-terminal-table
            [rows]="items()"
            (openPos)="openPOS($event)"
            (resetPin)="openResetPin($event)"
            (blockSeller)="openBlock($event)"
            (unblock)="unblock($event)"
            (disable)="openDisable($event)"
            (limits)="openLimits($event)"
          />
      </ng-container>

      <ng-container list-footer>
        <div class="seller-terminals-page__pagination">
          <button mat-button [disabled]="!hasPrevious()" (click)="prevPage()">
            <span class="material-symbols-outlined">chevron_left</span>
            {{ 'common.previous' | translate }}
          </button>
          <span>{{ 'admin.sellerTerminals.list.pagination.page' | translate: { page: page() + 1, total: totalPages() } }}</span>
          <button mat-button [disabled]="!hasNext()" (click)="nextPage()">
            {{ 'common.next' | translate }}
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
      </ng-container>
    </tch-admin-list-surface>
    </ng-template>
  </tch-async-view>
</tch-admin-page-shell>

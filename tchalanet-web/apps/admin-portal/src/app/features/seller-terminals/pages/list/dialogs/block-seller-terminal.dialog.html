<h2 mat-dialog-title>{{ 'admin.sellerTerminals.list.dialog.block.title' | translate }}</h2>

<mat-dialog-content>
  <p class="block-dialog__info">
    {{ 'admin.sellerTerminals.list.dialog.block.description' | translate: { name: data.displayName, code: data.terminalCode } }}
  </p>

  <form [formGroup]="form" class="block-dialog__form">
    @if (error(); as pageError) {
      <tch-error-panel [title]="pageError.title" [message]="pageError.message" />
    }
    <tch-form-error-summary [messages]="formSummary()" />

    <mat-form-field appearance="outline" class="block-dialog__field">
      <mat-label>{{ 'admin.sellerTerminals.list.dialog.block.reason' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="reason"
      rows="3"
      maxlength="200"
      [placeholder]="'admin.sellerTerminals.list.dialog.block.reasonPlaceholder' | translate"
    ></textarea>
    </mat-form-field>
    <tch-field-error [control]="form.controls.reason" />
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="saving()">{{ 'common.cancel' | translate }}</button>
  <button
    mat-flat-button
    color="warn"
    [disabled]="form.invalid || saving()"
    (click)="submit()"
  >
    @if (saving()) {
      <span class="material-symbols-outlined block-dialog__spin">progress_activity</span>
    }
    {{ 'admin.sellerTerminals.list.action.block' | translate }}
  </button>
</mat-dialog-actions>

<div class="seller-terminal-kpi-strip">
  <tch-admin-metric-card
    icon="check_circle"
    tone="positive"
    [label]="'admin.sellerTerminals.list.kpi.active' | translate"
    [value]="summary().activeCount.toString()"
  />
  <tch-admin-metric-card
    icon="block"
    tone="negative"
    [label]="'admin.sellerTerminals.list.kpi.blocked' | translate"
    [value]="summary().blockedCount.toString()"
  />
  <tch-admin-metric-card
    icon="payments"
    tone="accent"
    [label]="'admin.sellerTerminals.list.kpi.salesToday' | translate"
    [value]="((summary().salesTodayAmount | number:'1.0-0') ?? '0') + ' HTG'"
  />
  <tch-admin-metric-card
    icon="percent"
    tone="default"
    [label]="'admin.sellerTerminals.list.kpi.averageCommission' | translate"
    [value]="((summary().averageCommissionRate | number:'1.1-1') ?? '0') + '%'"
  />
</div>

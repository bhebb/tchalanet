<section class="seller-terminal-today-stats-card" [attr.aria-label]="'admin.sellerTerminals.detail.today.title' | translate">
  <h2 class="seller-terminal-today-stats-card__title">
    <span class="material-symbols-outlined" aria-hidden="true">today</span>
    {{ 'admin.sellerTerminals.detail.today.title' | translate }}
  </h2>
  @if (error(); as statsError) {
    <tch-error-panel
      [title]="statsError.title"
      [message]="statsError.message"
      [showRetry]="true"
      [retryLabel]="'common.retry' | translate"
      (retry)="retry.emit()"
    />
  } @else {
    <div class="seller-terminal-today-stats-card__grid tch-metric-grid">
      <tch-admin-metric-card
        icon="confirmation_number"
        tone="info"
        [label]="'admin.sellerTerminals.detail.today.ticketsSold' | translate"
        [value]="(stats().ticketsSold | number: '1.0-0') ?? '0'"
      />
      <tch-admin-metric-card
        icon="payments"
        tone="positive"
        [label]="'admin.sellerTerminals.detail.today.grossSales' | translate"
        [value]="((stats().grossSales | number: '1.0-2') ?? '0') + ' HTG'"
      />
      <tch-admin-metric-card
        icon="percent"
        tone="warning"
        [label]="'admin.sellerTerminals.detail.today.commission' | translate"
        [value]="((stats().sellerCommission | number: '1.0-2') ?? '0') + ' HTG'"
      />
      <tch-admin-metric-card
        icon="account_balance"
        tone="positive"
        [label]="'admin.sellerTerminals.detail.today.netRevenue' | translate"
        [value]="((stats().netRevenueEstimated | number: '1.0-2') ?? '0') + ' HTG'"
      />
    </div>
  }
</section>

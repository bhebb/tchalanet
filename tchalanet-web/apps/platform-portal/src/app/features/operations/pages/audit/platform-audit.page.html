<tch-admin-page-shell title="Audit" description="Journal fonctionnel des actions administratives et opérationnelles.">
  <div actions>
    <button mat-stroked-button color="warn" [disabled]="purging()" (click)="purge()" matTooltip="Purger uniquement les logs expirés selon la politique de rétention">
      <span class="material-symbols-outlined" aria-hidden="true">delete_sweep</span>
      Purger rétention
    </button>
    <button mat-icon-button class="platform-audit__refresh-action" (click)="load()" matTooltip="Rafraîchir">
      <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
    </button>
  </div>

  <tch-admin-list-surface
    searchLabel="ID entité"
    searchPlaceholder="uuid ou code"
    [searchValue]="filterForm.controls.entityId.value"
    [searchMinLength]="0"
    statusLabel="Type d'entité"
    [statusValue]="filterForm.controls.entityType.value"
    [statusOptions]="entityTypeOptions()"
    allStatusesLabel="Tous"
    resetLabel="Réinitialiser"
    [filtersDisplay]="'panel'"
    [filtersExpanded]="hasActiveFilters()"
    (searchChange)="onEntityIdFilter($event)"
    (statusChange)="onEntityTypeFilter($event)"
    (resetFilters)="resetFilters()"
  >
    <div list-filters [formGroup]="filterForm" class="platform-audit__filters">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Action</mat-label>
        <input matInput formControlName="action" placeholder="ex: CREATE" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Acteur ID</mat-label>
        <input matInput formControlName="actorId" placeholder="uuid acteur" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>IP</mat-label>
        <input matInput formControlName="ip" placeholder="127.0.0.1" />
      </mat-form-field>

      <tch-search-select
        label="Tenant"
        placeholder="Nom ou code du tenant"
        icon="apartment"
        emptyLabel="Aucun tenant trouvé"
        [searchFn]="searchTenants"
        (valueChange)="selectTenantFilter($event)"
      />

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Depuis</mat-label>
        <input matInput type="date" formControlName="from" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Jusqu'à</mat-label>
        <input matInput type="date" formControlName="to" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="button" (click)="applyFilters()">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        Filtrer
      </button>
    </div>

    <ng-container list-content>
      @if (loading()) {
        <tch-loading label="Chargement des événements..." />
      } @else if (error()) {
        <tch-error-panel [title]="error()!" [showRetry]="true" retryLabel="Réessayer" (retry)="load()" />
      } @else if (events().length === 0) {
        <tch-admin-empty-state
          icon="policy"
          title="Aucun événement"
          message="Aucun événement d'audit ne correspond aux filtres sélectionnés."
        />
      } @else {
        <tch-audit-events-table [events]="events()" [showTenantColumn]="true" />
      }
    </ng-container>

    <ng-container list-footer>
      <div class="platform-audit__pagination">
        <span class="platform-audit__pagination-total">{{ totalElements() }} événement(s)</span>
        <div class="platform-audit__pagination-nav">
          <button mat-button [disabled]="!hasPrevious()" (click)="prevPage()">
            <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
            Précédent
          </button>
          <span>Page {{ page() + 1 }} / {{ totalPages() }}</span>
          <button mat-button [disabled]="!hasNext()" (click)="nextPage()">
            Suivant
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
          </button>
        </div>
      </div>
    </ng-container>
  </tch-admin-list-surface>
</tch-admin-page-shell>

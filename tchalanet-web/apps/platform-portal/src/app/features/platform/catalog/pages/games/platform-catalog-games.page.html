<tch-admin-page-shell
  [title]="'platform.catalog.games.title' | translate"
  [description]="'platform.catalog.games.description' | translate"
>
  <div actions>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <span class="material-symbols-outlined">add</span>
      {{ 'platform.catalog.games.action.create' | translate }}
    </button>
  </div>

  <tch-admin-crud-shell>
    <tch-admin-data-toolbar
      toolbar
        [searchPlaceholder]="'platform.catalog.games.search.placeholder' | translate"
        [searchValue]="search()"
        (searchChange)="onSearch($event)"
      >
        <button mat-stroked-button (click)="load()">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </tch-admin-data-toolbar>

    <tch-async-view
      content
      [resource]="games"
      [error]="gamesError()"
      [loadingLabel]="'common.loading' | translate"
      [retryLabel]="'common.retry' | translate"
      (retry)="load()"
    >
      <tch-admin-empty-state
        empty
        icon="casino"
        [title]="'platform.catalog.games.empty.title' | translate"
        [message]="'platform.catalog.games.empty.message' | translate"
      />
      <ng-template tchAsyncReady>
        <tch-console-games-table
          [rows]="gameRows()"
          [showSortOrder]="true"
          (rowAction)="onGameAction($event)"
        />
      </ng-template>
    </tch-async-view>

    @if (hasGames()) {
      <tch-pagination
        footer
        [page]="pageIndex()"
        [size]="pageSize()"
        [totalElements]="totalElements()"
        (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)"
      />
    }
  </tch-admin-crud-shell>
</tch-admin-page-shell>

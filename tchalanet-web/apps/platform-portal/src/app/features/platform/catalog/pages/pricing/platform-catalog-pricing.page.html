<tch-admin-page-shell title="Cotes & pricing" description="Référentiel global des cotes de la plateforme, par jeu et type de pari.">
  <div actions>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <span class="material-symbols-outlined">add</span>
      Nouvelle cote
    </button>
  </div>

  <tch-admin-crud-shell>
    <div toolbar>
      <tch-admin-data-toolbar
        searchPlaceholder="Filtrer par jeu (BORLETTE…)"
        [searchValue]="gameFilter()"
        (searchChange)="onGameFilter($event)"
      >
        <mat-form-field appearance="outline" style="min-width:180px">
          <mat-label>Type de pari</mat-label>
          <mat-select [value]="betTypeFilter()" (valueChange)="onBetTypeFilter($event)">
            <mat-option value="">Tous</mat-option>
            @for (bt of betTypes; track bt) { <mat-option [value]="bt">{{ bt }}</mat-option> }
          </mat-select>
        </mat-form-field>
        <button mat-stroked-button (click)="load()">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </tch-admin-data-toolbar>
    </div>

    <tch-async-view
      content
      [resource]="pricing"
      [error]="pricingError()"
      loadingLabel="Chargement..."
      retryLabel="Réessayer"
      (retry)="load()"
    >
      <tch-admin-empty-state empty icon="percent" title="Aucune cote" message="Créez la première cote du catalogue." />

      <ng-container *tchAsyncReady>
        @if (allRows().length > 0 && rows().length === 0) {
          <tch-admin-empty-state icon="search_off" title="Aucun résultat" message="Aucune cote ne correspond aux filtres." />
        } @else {
          <tch-console-pricing-table
            [rows]="pricingRows()"
            [showTenant]="true"
            (rowAction)="onPricingAction($event)"
          />
        }
      </ng-container>
    </tch-async-view>

    <div footer>
      <span>{{ rows().length }} cote(s) {{ allRows().length !== rows().length ? '(filtré sur ' + allRows().length + ')' : '' }}</span>
    </div>
  </tch-admin-crud-shell>
</tch-admin-page-shell>

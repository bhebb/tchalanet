<tch-admin-page-shell [title]="pageTitle()">
  <div actions>
    <a mat-button [routerLink]="['..']">
      <span class="material-symbols-outlined">arrow_back</span>
      {{ 'common.back' | translate }}
    </a>
  </div>

  @if (loadingTenant()) {
    <tch-loading [label]="'platform.tenants.admin.loading' | translate" />
  } @else {
    <form (submit)="$event.preventDefault(); submit()" class="tenant-admin-create-page__form" novalidate>
      <tch-console-person-identity-form-section
        [form]="form"
        titleKey="platform.tenants.admin.section"
        [descriptionKey]="null"
      />

      <div class="tenant-admin-create-page__role-info">
        <span class="material-symbols-outlined">info</span>
        {{ 'platform.tenants.admin.roleInfo' | translate }}
      </div>

      @if (error(); as errorVm) {
        <tch-error-panel [title]="errorVm.title" [message]="errorVm.message" />
      }

      <div class="tenant-admin-create-page__form-actions">
        <a mat-button [routerLink]="['..']">{{ 'common.cancel' | translate }}</a>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="form().invalid() || loading()"
        >
          @if (loading()) {
            <span class="material-symbols-outlined spin" aria-hidden="true">progress_activity</span>
          }
          {{ 'platform.tenants.admin.submit' | translate }}
        </button>
      </div>
    </form>
  }
</tch-admin-page-shell>

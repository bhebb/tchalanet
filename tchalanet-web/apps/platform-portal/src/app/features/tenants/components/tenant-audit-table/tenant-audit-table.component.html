<table mat-table [dataSource]="events()" class="tenant-audit-table">
  <ng-container matColumnDef="occurredAt">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let row" class="tenant-audit-table__mono">
      {{ row.occurredAt | date:'dd/MM/yy HH:mm:ss' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actor">
    <th mat-header-cell *matHeaderCellDef>Acteur</th>
    <td mat-cell *matCellDef="let row">
      <tch-admin-status-pill [tone]="actorTone(row.actorType)" [label]="row.actorType" />
    </td>
  </ng-container>

  <ng-container matColumnDef="entity">
    <th mat-header-cell *matHeaderCellDef>Entité</th>
    <td mat-cell *matCellDef="let row">
      <code class="tenant-audit-table__entity-type">{{ row.entityType }}</code>
      <span class="tenant-audit-table__subtext">{{ row.entityId.slice(0, 12) }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let row">
      <tch-admin-status-pill [tone]="actionTone(row.action)" [label]="row.action" />
    </td>
  </ng-container>

  <ng-container matColumnDef="ip">
    <th mat-header-cell *matHeaderCellDef>IP</th>
    <td mat-cell *matCellDef="let row" class="tenant-audit-table__mono">{{ row.ip ?? '—' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"></tr>
</table>

<tch-pagination
  [page]="page()"
  [size]="size()"
  [totalElements]="totalElements()"
  (pageChange)="pageChange.emit($event)"
/>
